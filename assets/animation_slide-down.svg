  .entry { animation: none; }
}
</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="398" height="226" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="398" height="226" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">SLIDE-DOWN</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Use it with animation="slide-down".</text><text x="24.0" y="115.6" font-size="16" fill="#F2F2FF">The block fades in while moving down, entering</text><text x="24.0" y="139.6" font-size="16" fill="#F2F2FF">from above.</text><text x="24.0" y="173.6" font-size="16" fill="#F2F2FF">This preview repeats every 5 seconds with</text><text x="24.0" y="197.6" font-size="16" fill="#F2F2FF">animation_loop=5.</text></g></g></svg>