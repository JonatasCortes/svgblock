<svg xmlns="http://www.w3.org/2000/svg" width="400" height="228" viewBox="0 0 400 228"><style>
@keyframes entry {
  0% { opacity: 0; transform: translateY(-24px); } 16.000% { opacity: 1; transform: none; } 100% { opacity: 1; transform: none; }
}
.entry {
  animation: entry 5s ease-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
