</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="810" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="810" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Tables</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Use .table(columns, rows) to draw a themed table with a header, optional stripes, dividers and rounded</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">borders. Cells accept <tspan fill="#00F0FF" font-weight="700">inline styles</tspan>.</text><circle cx="27.1" cy="134.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="140.7" font-size="17" fill="#B26BFF" font-weight="700">Options</text><clipPath id="table-clip-24-158"><rect x="24.0" y="157.5" width="752.0" height="333.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-158)"><rect x="24.0" y="157.5" width="752.0" height="333.0" fill="#0C0D1B"/><rect x="24.0" y="157.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="231.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="305.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="379.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="453.5" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="194.5" x2="776.0" y2="194.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="231.5" x2="776.0" y2="231.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="268.5" x2="776.0" y2="268.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="305.5" x2="776.0" y2="305.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="342.5" x2="776.0" y2="342.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="379.5" x2="776.0" y2="379.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="416.5" x2="776.0" y2="416.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="453.5" x2="776.0" y2="453.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">Option</text><text x="292.6" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700" text-anchor="middle">Default</text><text x="561.1" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700" text-anchor="middle">What it does</text><text x="32.0" y="217.9" font-size="14" fill="#F2F2FF">font_size</text><text x="292.6" y="217.9" font-size="14" fill="#F2F2FF" text-anchor="middle">14</text><text x="561.1" y="217.9" font-size="14" fill="#F2F2FF" text-anchor="middle">The size of the table text.</text><text x="32.0" y="254.9" font-size="14" fill="#F2F2FF">cell_padding</text><text x="292.6" y="254.9" font-size="14" fill="#F2F2FF" text-anchor="middle">8</text><text x="561.1" y="254.9" font-size="14" fill="#F2F2FF" text-anchor="middle">The space around the text of each cell.</text><text x="32.0" y="291.9" font-size="14" fill="#F2F2FF">border_radius</text><text x="292.6" y="291.9" font-size="14" fill="#F2F2FF" text-anchor="middle">8</text><text x="561.1" y="291.9" font-size="14" fill="#F2F2FF" text-anchor="middle">How rounded the corners of the table are.</text><text x="32.0" y="328.9" font-size="14" fill="#F2F2FF">align</text><text x="292.6" y="328.9" font-size="14" fill="#F2F2FF" text-anchor="middle">left</text><text x="561.1" y="328.9" font-size="14" fill="#F2F2FF" text-anchor="middle">A list with left, center or right for each column.</text><text x="32.0" y="365.9" font-size="14" fill="#F2F2FF">weights</text><text x="292.6" y="365.9" font-size="14" fill="#F2F2FF" text-anchor="middle">equal</text><text x="561.1" y="365.9" font-size="14" fill="#F2F2FF" text-anchor="middle">The relative width of each column.</text><text x="32.0" y="402.9" font-size="14" fill="#F2F2FF">striped</text><text x="292.6" y="402.9" font-size="14" fill="#F2F2FF" text-anchor="middle">True</text><text x="561.1" y="402.9" font-size="14" fill="#F2F2FF" text-anchor="middle">Alternates the background of the rows.</text><text x="32.0" y="439.9" font-size="14" fill="#F2F2FF">row_dividers</text><text x="292.6" y="439.9" font-size="14" fill="#F2F2FF" text-anchor="middle">True</text><text x="561.1" y="439.9" font-size="14" fill="#F2F2FF" text-anchor="middle">Draws a line between rows.</text><text x="32.0" y="476.9" font-size="14" fill="#F2F2FF">column_dividers</text><text x="292.6" y="476.9" font-size="14" fill="#F2F2FF" text-anchor="middle">False</text><text x="561.1" y="476.9" font-size="14" fill="#F2F2FF" text-anchor="middle">Draws a line between columns.</text><rect x="24.5" y="158.0" width="751.0" height="332.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="513.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="519.2" font-size="17" fill="#B26BFF" font-weight="700">Values</text><text x="24.0" y="553.6" font-size="16" fill="#F2F2FF">Booleans become ✓ and ✗, None becomes an empty cell and numbers are converted to text. Every row</text><text x="24.0" y="577.6" font-size="16" fill="#F2F2FF">needs as many cells as there are columns. Long words are broken inside narrow columns.</text><rect x="24.0" y="594.0" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="623.6" font-size="16" fill="#F2F2FF">Live example, with the alignment set per column:</text><clipPath id="table-clip-24-640"><rect x="24.0" y="640.0" width="752.0" height="148.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-640)"><rect x="24.0" y="640.0" width="752.0" height="148.0" fill="#0C0D1B"/><rect x="24.0" y="640.0" width="7