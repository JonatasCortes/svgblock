<svg xmlns="http://www.w3.org/2000/svg" width="800" height="956.5" viewBox="0 0 800 956.5"><style>
@keyframes entry {
  from { opacity: 0; } to { opacity: 1; transform: none; }
}
.entry {
  animation: entry 0.8s ease-out both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .entry { animation: none; }
}
</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="954.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="954.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Animations</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Animations are <tspan fill="#00F0FF" font-weight="700">optional</tspan>. By default a block is static. Choose an entrance animation with the <tspan fill="#00F0FF" font-weight="700">animation</tspan></text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">parameter and it plays once, in 0.8 seconds, when the block appears. The theme never decides it.</text><clipPath id="table-clip-24-122"><rect x="24.0" y="122.0" width="752.0" height="296.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-122)"><rect x="24.0" y="122.0" width="752.0" height="296.0" fill="#0C0D1B"/><rect x="24.0" y="122.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="196.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="270.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="344.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="159.0" x2="776.0" y2="159.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="196.0" x2="776.0" y2="196.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="233.0" x2="776.0" y2="233.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="270.0" x2="776.0" y2="270.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="307.0" x2="776.0" y2="307.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="344.0" x2="776.0" y2="344.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="381.0" x2="776.0" y2="381.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">Name</text><text x="182.4" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="182.4" font-size="14" fill="#F2F2FF">None</text><text x="182.4" y="182.4" font-size="14" fill="#F2F2FF">No animation. The block is static. This is the default.</text><text x="32.0" y="219.4" font-size="14" fill="#F2F2FF">fade</text><text x="182.4" y="219.4" font-size="14" fill="#F2F2FF">The block fades in. The most discreet one, and the default.</text><text x="32.0" y="256.4" font-size="14" fill="#F2F2FF">slide-up</text><text x="182.4" y="256.4" font-size="14" fill="#F2F2FF">The block fades in while moving up, entering from below.</text><text x="32.0" y="293.4" font-size="14" fill="#F2F2FF">slide-down</text><text x="182.4" y="293.4" font-size="14" fill="#F2F2FF">The block fades in while moving down, entering from above.</text><text x="32.0" y="330.4" font-size="14" fill="#F2F2FF">slide-left</text><text x="182.4" y="330.4" font-size="14" fill="#F2F2FF">The block fades in while moving left, entering from the right.</text><text x="32.0" y="367.4" font-size="14" fill="#F2F2FF">slide-right</text><text x="182.4" y="367.4" font-size="14" fill="#F2F2FF">The block fades in while moving right, entering from the left.</text><text x="32.0" y="404.4" font-size="14" fill="#F2F2FF">pop</text><text x="182.4" y="404.4" font-size="14" fill="#F2F2FF">The block fades in while growing slightly, from a bit smaller to its final size.</text><rect x="24.5" y="122.5" width="751.0" height="295.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="445.6" font-size="16" fill="#F2F2FF">You can pass the name as a string or use the Animation enum, which gives you autocomplete in your</text><text x="24.0" y="469.6" font-size="16" fill="#F2F2FF">editor.</text><rect x="24.0" y="486.0" width="752.0" height="2" rx="1" fill="#7000FF"/><circle cx="27.1" cy="510.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="516.7" font-size="17" fill="#B26BFF" font-weight="700">Repeating the animation</text><text x="24.0" y="551.1" font-size="16" fill="#F2F2FF">By default the entrance plays once. Pass <tspan fill="#00F0FF" font-weight="700">animation_loop</tspan> with a number of seconds to replay it over and</text><text x="24.0" y="575.1" font-size="16" fill="#F2F2FF">over, without JavaScript, so it works inside a README image.</text><clipPath id="table-clip-24-592"><rect x="24.0" y="591.5" width="752.0" height="111.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-592)"><rect x="24.0" y="591.5" width="752.0" height="111.0" fill="#0C0D1B"/><rect x="24.0" y="591.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="665.5" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="628.5" x2="776.0" y2="628.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="665.5" x2="776.0" y2="665.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="614.9" font-size="14" fill="#FF1F6E" font-weight="700">Value</text><text x="182.4" y="614.9" font-size="14" fill="#FF1F6E" font-weight="700">Behavior</text><text x="32.0" y="651.9" font-size="14" fill="#F2F2FF">None</text><text x="182.4" y="651.9" font-size="14" fill="#F2F2FF">The animation plays once. This is the default.</text><text x="32.0" y="688.9" font-size="14" fill="#F2F2FF">a number</text><text x="182.4" y="688.9" font-size="14" fill="#F2F2FF">The animation repeats every that many seconds.</text><rect x="24.5" y="592.0" width="751.0" height="110.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="730.1" font-size="16" fill="#F2F2FF">The number is the length of the <tspan fill="#00F0FF" font-weight="700">whole cycle</tspan>, not just the pause. With animation_loop=5, the entrance</text><text x="24.0" y="754.1" font-size="16" fill="#F2F2FF">takes 0.8 seconds and the block stays still and visible for the other 4.2, then disappears and enters again.</text><text x="24.0" y="788.1" font-size="16" fill="#F2F2FF">• The value must be <tspan fill="#00F0FF" font-weight="700">greater than 0.8</tspan>, the duration of the entrance.</text><text x="24.0" y="822.1" font-size="16" fill="#F2F2FF">• animation_loop needs an animation. Using it with animation=None raises a ValueError.</text><text x="24.0" y="856.1" font-size="16" fill="#F2F2FF">• Short intervals leave little time to read, so prefer 5 seconds or more for blocks with a lot of text.</text><rect x="24.0" y="872.5" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="902.1" font-size="16" fill="#F2F2FF">People who turned on reduce motion in their system settings see the block with no animation at all. The</text><text x="24.0" y="926.1" font-size="16" fill="#F2F2FF">previews below repeat every 5 seconds, so you do not need to reload the page.</text></g></g></svg>