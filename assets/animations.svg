<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1687" viewBox="0 0 800 1687"><style>
@keyframes fadein-ac8a6a58 {
0% { opacity: 0; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); } 100% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
.fadein-ac8a6a58 {
  animation: fadein-ac8a6a58 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fadein-ac8a6a58 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1685" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1685" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Animations</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">An animation moves the whole block when the image is displayed. You create it from one of the animation</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">classes and hand it to the block with the <tspan fill="#00F0FF" font-weight="700">animation</tspan> parameter. Without the parameter, the block is static.</text><text x="24.0" y="139.6" font-size="16" fill="#F2F2FF">Animations come in four kinds. <tspan fill="#00F0FF" font-weight="700">Entrances</tspan> (names ending in <tspan fill="#00F0FF" font-weight="700">In</tspan>) start with the block hidden or away and</text><text x="24.0" y="163.6" font-size="16" fill="#F2F2FF">end with it in place. <tspan fill="#00F0FF" font-weight="700">Exits</tspan> (names ending in <tspan fill="#00F0FF" font-weight="700">Out</tspan>) do the opposite: every entrance has an exit. <tspan fill="#00F0FF" font-weight="700">Ambient</tspan></text><text x="24.0" y="187.6" font-size="16" fill="#F2F2FF">animations keep the block in view and move it continuously. <tspan fill="#00F0FF" font-weight="700">Utilities</tspan> wait or chain other animations.</text><circle cx="27.1" cy="216.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="222.7" font-size="17" fill="#B26BFF" font-weight="700">Entrances and exits</text><clipPath id="table-clip-24-240"><rect x="24.0" y="239.5" width="752.0" height="607.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-240)"><rect x="24.0" y="239.5" width="752.0" height="607.0" fill="#0C0D1B"/><rect x="24.0" y="239.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="313.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="408.5" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="503.5" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="619.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="714.5" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="809.5" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="276.5" x2="776.0" y2="276.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="313.5" x2="776.0" y2="313.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="350.5" x2="776.0" y2="350.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="408.5" x2="776.0" y2="408.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="466.5" x2="776.0" y2="466.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="503.5" x2="776.0" y2="503.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="561.5" x2="776.0" y2="561.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="619.5" x2="776.0" y2="619.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="656.5" x2="776.0" y2="656.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="714.5" x2="776.0" y2="714.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="772.5" x2="776.0" y2="772.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="809.5" x2="776.0" y2="809.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="262.9" font-size="14" fill="#FF1F6E" font-weight="700">Pair</text><text x="282.7" y="262.9" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="299.9" font-size="14" fill="#F2F2FF">FadeIn() / FadeOut()</text><text x="282.7" y="299.9" font-size="14" fill="#F2F2FF">The block fades in, or out.</text><text x="32.0" y="336.9" font-size="14" fill="#F2F2FF">FocusIn() / FocusOut()</text><text x="282.7" y="336.9" font-size="14" fill="#F2F2FF">The block sharpens from a blur as it appears, or blurs as it leaves.</text><text x="32.0" y="373.9" font-size="14" fill="#F2F2FF">RiseIn() / RiseOut()</text><text x="282.7" y="373.9" font-size="14" fill="#F2F2FF">The block rises into place from below. The exit keeps rising and leaves</text><text x="282.7" y="394.9" font-size="14" fill="#F2F2FF">upwards.</text><text x="32.0" y="431.9" font-size="14" fill="#F2F2FF">DropIn() / DropOut()</text><text x="282.7" y="431.9" font-size="14" fill="#F2F2FF">The block drops into place from above. The exit keeps dropping and leaves</text><text x="282.7" y="452.9" font-size="14" fill="#F2F2FF">downwards.</text><text x="32.0" y="489.9" font-size="14" fill="#F2F2FF">SlideIn() / SlideOut()</text><text x="282.7" y="489.9" font-size="14" fill="#F2F2FF">The block slides in sideways. The exit keeps going the same way.</text><text x="32.0" y="526.9" font-size="14" fill="#F2F2FF">PopIn() / PopOut()</text><text x="282.7" y="526.9" font-size="14" fill="#F2F2FF">The block grows from a smaller size to its normal size, dips a little and settles.</text><text x="282.7" y="547.9" font-size="14" fill="#F2F2FF">It never gets bigger than normal. The exit is the entrance played backwards.</text><text x="32.0" y="584.9" font-size="14" fill="#F2F2FF">ZoomIn() / ZoomOut()</text><text x="282.7" y="584.9" font-size="14" fill="#F2F2FF">The block grows from a smaller size, without a bounce. The exit shrinks back</text><text x="282.7" y="605.9" font-size="14" fill="#F2F2FF">to it.</text><text x="32.0" y="642.9" font-size="14" fill="#F2F2FF">SpinIn() / SpinOut()</text><text x="282.7" y="642.9" font-size="14" fill="#F2F2FF">The block turns while it appears. The exit keeps turning the same way.</text><text x="32.0" y="679.9" font-size="14" fill="#F2F2FF">FlipIn() / FlipOut()</text><text x="282.7" y="679.9" font-size="14" fill="#F2F2FF">The block flips like a card, passing through the point where it is edge-on. The</text><text x="282.7" y="700.9" font-size="14" fill="#F2F2FF">exit flips back.</text><text x="32.0" y="737.9" font-size="14" fill="#F2F2FF">UnfoldIn() / UnfoldOut()</text><text x="282.7" y="737.9" font-size="14" fill="#F2F2FF">The block opens like a panel hinged to an edge. The exit folds back to the</text><text x="282.7" y="758.9" font-size="14" fill="#F2F2FF">same edge.</text><text x="32.0" y="795.9" font-size="14" fill="#F2F2FF">FlickerIn() / FlickerOut()</text><text x="282.7" y="795.9" font-size="14" fill="#F2F2FF">The block switches on, or off, flickering like a neon sign.</text><text x="32.0" y="832.9" font-size="14" fill="#F2F2FF">GlitchIn() / GlitchOut()</text><text x="282.7" y="832.9" font-size="14" fill="#F2F2FF">Sharp jumps in position, width and opacity, with no smooth movement.</text><rect x="24.5" y="240.0" width="751.0" height="606.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="869.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="875.2" font-size="17" fill="#B26BFF" font-weight="700">Ambient</text><clipPath id="table-clip-24-892"><rect x="24.0" y="892.0" width="752.0" height="296.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-892)"><rect x="24.0" y="892.0" width="752.0" height="296.0" fill="#0C0D1B"/><rect x="24.0" y="892.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="966.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="1040.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="1114.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="929.0" x2="776.0" y2="929.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="966.0" x2="776.0" y2="966.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1003.0" x2="776.0" y2="1003.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1040.0" x2="776.0" y2="1040.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1077.0" x2="776.0" y2="1077.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1114.0" x2="776.0" y2="1114.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1151.0" x2="776.0" y2="1151.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="915.4" font-size="14" fill="#FF1F6E" font-weight="700">Animation</text><text x="282.7" y="915.4" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="952.4" font-size="14" fill="#F2F2FF">Pulse()</text><text x="282.7" y="952.4" font-size="14" fill="#F2F2FF">The block grows and shrinks gently, staying in place.</text><text x="32.0" y="989.4" font-size="14" fill="#F2F2FF">Float()</text><text x="282.7" y="989.4" font-size="14" fill="#F2F2FF">The block floats up and down.</text><text x="32.0" y="1026.4" font-size="14" fill="#F2F2FF">Sway()</text><text x="282.7" y="1026.4" font-size="14" fill="#F2F2FF">The block swings like a pendulum.</text><text x="32.0" y="1063.4" font-size="14" fill="#F2F2FF">Shake()</text><text x="282.7" y="1063.4" font-size="14" fill="#F2F2FF">The block shakes sideways and loses strength until it stops.</text><text x="32.0" y="1100.4" font-size="14" fill="#F2F2FF">Rotate()</text><text x="282.7" y="1100.4" font-size="14" fill="#F2F2FF">The block turns, a full turn by default.</text><text x="32.0" y="1137.4" font-size="14" fill="#F2F2FF">Drift()</text><text x="282.7" y="1137.4" font-size="14" fill="#F2F2FF">The block slides in a soft figure eight around its place.</text><text x="32.0" y="1174.4" font-size="14" fill="#F2F2FF">Jelly()</text><text x="282.7" y="1174.4" font-size="14" fill="#F2F2FF">The block stretches and squashes in turns, like jelly, until it settles.</text><rect x="24.5" y="892.5" width="751.0" height="295.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="1210.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="1216.7" font-size="17" fill="#B26BFF" font-weight="700">Utilities</text><clipPath id="table-clip-24-1234"><rect x="24.0" y="1233.5" width="752.0" height="148.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-1234)"><rect x="24.0" y="1233.5" width="752.0" height="148.0" fill="#0C0D1B"/><rect x="24.0" y="1233.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="1307.5" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="1270.5" x2="776.0" y2="1270.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1307.5" x2="776.0" y2="1307.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1344.5" x2="776.0" y2="1344.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="1256.9" font-size="14" fill="#FF1F6E" font-weight="700">Animation</text><text x="282.7" y="1256.9" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="1293.9" font-size="14" fill="#F2F2FF">Show(duration)</text><text x="282.7" y="1293.9" font-size="14" fill="#F2F2FF">The block stays visible and still for a while.</text><text x="32.0" y="1330.9" font-size="14" fill="#F2F2FF">Hide(duration)</text><text x="282.7" y="1330.9" font-size="14" fill="#F2F2FF">The block stays hidden for a while.</text><text x="32.0" y="1367.9" font-size="14" fill="#F2F2FF">Sequence(...)</text><text x="282.7" y="1367.9" font-size="14" fill="#F2F2FF">Plays several animations one after another.</text><rect x="24.5" y="1234.0" width="751.0" height="147.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="1404.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="1410.2" font-size="17" fill="#B26BFF" font-weight="700">Three ways to choose an animation</text><clipPath id="table-clip-24-1427"><rect x="24.0" y="1427.0" width="752.0" height="190.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-1427)"><rect x="24.0" y="1427.0" width="752.0" height="190.0" fill="#0C0D1B"/><rect x="24.0" y="1427.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="1501.0" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="1464.0" x2="776.0" y2="1464.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1501.0" x2="776.0" y2="1501.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1559.0" x2="776.0" y2="1559.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="1450.4" font-size="14" fill="#FF1F6E" font-weight="700">Form</text><text x="168.7" y="1450.4" font-size="14" fill="#FF1F6E" font-weight="700">Example</text><text x="510.5" y="1450.4" font-size="14" fill="#FF1F6E" font-weight="700">Use it to</text><text x="32.0" y="1487.4" font-size="14" fill="#F2F2FF">Default values</text><text x="168.7" y="1487.4" font-size="14" fill="#F2F2FF">animation=RiseIn()</text><text x="510.5" y="1487.4" font-size="14" fill="#F2F2FF">Get an animation exactly as it comes.</text><text x="32.0" y="1524.4" font-size="14" fill="#F2F2FF">A configured</text><text x="32.0" y="1545.4" font-size="14" fill="#F2F2FF">animation</text><text x="168.7" y="1524.4" font-size="14" fill="#F2F2FF">animation=RiseIn(distance=80)</text><text x="510.5" y="1524.4" font-size="14" fill="#F2F2FF">Adjust durations, distances, sizes, curves</text><text x="510.5" y="1545.4" font-size="14" fill="#F2F2FF">and repetitions.</text><text x="32.0" y="1582.4" font-size="14" fill="#F2F2FF">A sequence</text><text x="168.7" y="1582.4" font-size="14" fill="#F2F2FF">animation=Sequence(...)</text><text x="510.5" y="1582.4" font-size="14" fill="#F2F2FF">Chain animations, add waiting times and</text><text x="510.5" y="1603.4" font-size="14" fill="#F2F2FF">repeat the whole thing.</text><rect x="24.5" y="1427.5" width="751.0" height="189.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><rect x="24.0" y="1627.0" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="1656.6" font-size="16" fill="#F2F2FF">People who turned on reduce motion in their system settings see the block without any animation.</text></g></g></g></svg>