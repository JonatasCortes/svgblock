<svg xmlns="http://www.w3.org/2000/svg" width="800" height="802.5" viewBox="0 0 800 802.5"><style>
@keyframes fade-f16f3800 {
0% { opacity: 0; transform: translate(0px, 0px) scale(1); } 100% { opacity: 1; transform: translate(0px, 0px) scale(1); }
}
.fade-f16f3800 {
  animation: fade-f16f3800 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fade-f16f3800 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="800.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="800.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Animations</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">An animation moves the whole block when the image is displayed. You create it from one of the animation</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">classes and hand it to the block with the <tspan fill="#00F0FF" font-weight="700">animation</tspan> parameter. Without the parameter, the block is static.</text><clipPath id="table-clip-24-122"><rect x="24.0" y="122.0" width="752.0" height="375.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-122)"><rect x="24.0" y="122.0" width="752.0" height="375.0" fill="#0C0D1B"/><rect x="24.0" y="122.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="196.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="270.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="344.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="460.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="159.0" x2="776.0" y2="159.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="196.0" x2="776.0" y2="196.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="233.0" x2="776.0" y2="233.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="270.0" x2="776.0" y2="270.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="307.0" x2="776.0" y2="307.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="344.0" x2="776.0" y2="344.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="402.0" x2="776.0" y2="402.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="460.0" x2="776.0" y2="460.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">Animation</text><text x="282.7" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">Kind</text><text x="408.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="182.4" font-size="14" fill="#F2F2FF">Fade()</text><text x="282.7" y="182.4" font-size="14" fill="#F2F2FF">entrance</text><text x="408.0" y="182.4" font-size="14" fill="#F2F2FF">The block fades in.</text><text x="32.0" y="219.4" font-size="14" fill="#F2F2FF">Rise()</text><text x="282.7" y="219.4" font-size="14" fill="#F2F2FF">entrance</text><text x="408.0" y="219.4" font-size="14" fill="#F2F2FF">The block rises from below while fading in.</text><text x="32.0" y="256.4" font-size="14" fill="#F2F2FF">Drop()</text><text x="282.7" y="256.4" font-size="14" fill="#F2F2FF">entrance</text><text x="408.0" y="256.4" font-size="14" fill="#F2F2FF">The block drops from above while fading in.</text><text x="32.0" y="293.4" font-size="14" fill="#F2F2FF">Pop()</text><text x="282.7" y="293.4" font-size="14" fill="#F2F2FF">entrance</text><text x="408.0" y="293.4" font-size="14" fill="#F2F2FF">The block grows from a smaller size while fading in.</text><text x="32.0" y="330.4" font-size="14" fill="#F2F2FF">Pulse()</text><text x="282.7" y="330.4" font-size="14" fill="#F2F2FF">ambient</text><text x="408.0" y="330.4" font-size="14" fill="#F2F2FF">The block grows and shrinks gently, staying in place.</text><text x="32.0" y="367.4" font-size="14" fill="#F2F2FF">Show(duration)</text><text x="282.7" y="367.4" font-size="14" fill="#F2F2FF">utility</text><text x="408.0" y="367.4" font-size="14" fill="#F2F2FF">The block stays visible and still for a while. Used inside a</text><text x="408.0" y="388.4" font-size="14" fill="#F2F2FF">sequence.</text><text x="32.0" y="425.4" font-size="14" fill="#F2F2FF">Hide(duration)</text><text x="282.7" y="425.4" font-size="14" fill="#F2F2FF">utility</text><text x="408.0" y="425.4" font-size="14" fill="#F2F2FF">The block stays hidden for a while. Used inside a</text><text x="408.0" y="446.4" font-size="14" fill="#F2F2FF">sequence.</text><text x="32.0" y="483.4" font-size="14" fill="#F2F2FF">Sequence(...)</text><text x="282.7" y="483.4" font-size="14" fill="#F2F2FF">utility</text><text x="408.0" y="483.4" font-size="14" fill="#F2F2FF">Plays several animations one after another.</text><rect x="24.5" y="122.5" width="751.0" height="374.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="519.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="525.7" font-size="17" fill="#B26BFF" font-weight="700">Three ways to choose an animation</text><clipPath id="table-clip-24-542"><rect x="24.0" y="542.5" width="752.0" height="190.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-542)"><rect x="24.0" y="542.5" width="752.0" height="190.0" fill="#0C0D1B"/><rect x="24.0" y="542.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="616.5" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="579.5" x2="776.0" y2="579.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="616.5" x2="776.0" y2="616.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="674.5" x2="776.0" y2="674.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="565.9" font-size="14" fill="#FF1F6E" font-weight="700">Form</text><text x="168.7" y="565.9" font-size="14" fill="#FF1F6E" font-weight="700">Example</text><text x="510.5" y="565.9" font-size="14" fill="#FF1F6E" font-weight="700">Use it to</text><text x="32.0" y="602.9" font-size="14" fill="#F2F2FF">Default values</text><text x="168.7" y="602.9" font-size="14" fill="#F2F2FF">animation=Rise()</text><text x="510.5" y="602.9" font-size="14" fill="#F2F2FF">Get an animation exactly as it comes.</text><text x="32.0" y="639.9" font-size="14" fill="#F2F2FF">A configured</text><text x="32.0" y="660.9" font-size="14" fill="#F2F2FF">animation</text><text x="168.7" y="639.9" font-size="14" fill="#F2F2FF">animation=Rise(distance=80)</text><text x="510.5" y="639.9" font-size="14" fill="#F2F2FF">Adjust durations, distances, sizes, curves</text><text x="510.5" y="660.9" font-size="14" fill="#F2F2FF">and repetitions.</text><text x="32.0" y="697.9" font-size="14" fill="#F2F2FF">A sequence</text><text x="168.7" y="697.9" font-size="14" fill="#F2F2FF">animation=Sequence(...)</text><text x="510.5" y="697.9" font-size="14" fill="#F2F2FF">Chain animations, add waiting times and</text><text x="510.5" y="718.9" font-size="14" fill="#F2F2FF">repeat the whole thing.</text><rect x="24.5" y="543.0" width="751.0" height="189.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><rect x="24.0" y="742.5" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="772.1" font-size="16" fill="#F2F2FF">People who turned on reduce motion in their system settings see the block without any animation.</text></g></g></g></svg>