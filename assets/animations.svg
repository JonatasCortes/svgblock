<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1416" viewBox="0 0 800 1416"><style>
@keyframes fadein-ac8a6a58 {
0% { opacity: 0; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); } 100% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
.fadein-ac8a6a58 {
  animation: fadein-ac8a6a58 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fadein-ac8a6a58 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1414" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1414" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Animations</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">An animation moves the whole block when the image is displayed. You create it from one of the animation</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">classes and hand it to the block with the <tspan fill="#00F0FF" font-weight="700">animation</tspan> parameter. Without it, the block is static.</text><text x="24.0" y="139.6" font-size="16" fill="#F2F2FF">Animations come in four kinds. <tspan fill="#00F0FF" font-weight="700">Entrances</tspan> (names ending in <tspan fill="#00F0FF" font-weight="700">In</tspan>) start with the block hidden or away and</text><text x="24.0" y="163.6" font-size="16" fill="#F2F2FF">end with it in place. <tspan fill="#00F0FF" font-weight="700">Exits</tspan> (names ending in <tspan fill="#00F0FF" font-weight="700">Out</tspan>) do the opposite: every entrance has an exit. <tspan fill="#00F0FF" font-weight="700">Ambient</tspan></text><text x="24.0" y="187.6" font-size="16" fill="#F2F2FF">animations keep the block in view and move it continuously. <tspan fill="#00F0FF" font-weight="700">Utilities</tspan> wait or chain other animations.</text><circle cx="27.1" cy="216.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="222.7" font-size="17" fill="#B26BFF" font-weight="700">Entrances and exits</text><clipPath id="table-clip-24-240"><rect x="24.0" y="239.5" width="752.0" height="649.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-240)"><rect x="24.0" y="239.5" width="752.0" height="649.0" fill="#0C0D1B"/><rect x="24.0" y="239.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="313.5" width="752.0" height="79.0" fill="#101125"/><rect x="24.0" y="450.5" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="545.5" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="661.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="756.5" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="851.5" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="276.5" x2="776.0" y2="276.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="313.5" x2="776.0" y2="313.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="392.5" x2="776.0" y2="392.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="450.5" x2="776.0" y2="450.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="508.5" x2="776.0" y2="508.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="545.5" x2="776.0" y2="545.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="603.5" x2="776.0" y2="603.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="661.5" x2="776.0" y2="661.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="698.5" x2="776.0" y2="698.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="756.5" x2="776.0" y2="756.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="814.5" x2="776.0" y2="814.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="851.5" x2="776.0" y2="851.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="262.9" font-size="14" fill="#FF1F6E" font-weight="700">Pair</text><text x="282.7" y="262.9" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="299.9" font-size="14" fill="#F2F2FF">FadeIn() / FadeOut()</text><text x="282.7" y="299.9" font-size="14" fill="#F2F2FF">The block fades in, or out.</text><text x="32.0" y="336.9" font-size="14" fill="#F2F2FF">FocusIn() / FocusOut()</text><text x="282.7" y="336.9" font-size="14" fill="#F2F2FF">The block sharpens from a blur as it appears, or blurs as it leaves. Safari does</text><text x="282.7" y="357.9" font-size="14" fill="#F2F2FF">not draw the blur, so there the block only fades. The same applies to</text><text x="282.7" y="378.9" font-size="14" fill="#F2F2FF">focus=True in the other animations.</text><text x="32.0" y="415.9" font-size="14" fill="#F2F2FF">RiseIn() / RiseOut()</text><text x="282.7" y="415.9" font-size="14" fill="#F2F2FF">The block rises into place from below. The exit keeps rising and leaves</text><text x="282.7" y="436.9" font-size="14" fill="#F2F2FF">upwards.</text><text x="32.0" y="473.9" font-size="14" fill="#F2F2FF">DropIn() / DropOut()</text><text x="282.7" y="473.9" font-size="14" fill="#F2F2FF">The block drops into place from above. The exit keeps dropping and leaves</text><text x="282.7" y="494.9" font-size="14" fill="#F2F2FF">downwards.</text><text x="32.0" y="531.9" font-size="14" fill="#F2F2FF">SlideIn() / SlideOut()</text><text x="282.7" y="531.9" font-size="14" fill="#F2F2FF">The block slides in sideways. The exit keeps going the same way.</text><text x="32.0" y="568.9" font-size="14" fill="#F2F2FF">PopIn() / PopOut()</text><text x="282.7" y="568.9" font-size="14" fill="#F2F2FF">The block grows from a smaller size to its normal size, dips a little and settles.</text><text x="282.7" y="589.9" font-size="14" fill="#F2F2FF">It never gets bigger than normal. The exit is the entrance played backwards.</text><text x="32.0" y="626.9" font-size="14" fill="#F2F2FF">ZoomIn() / ZoomOut()</text><text x="282.7" y="626.9" font-size="14" fill="#F2F2FF">The block grows from a smaller size, without a bounce. The exit shrinks back</text><text x="282.7" y="647.9" font-size="14" fill="#F2F2FF">to it.</text><text x="32.0" y="684.9" font-size="14" fill="#F2F2FF">SpinIn() / SpinOut()</text><text x="282.7" y="684.9" font-size="14" fill="#F2F2FF">The block turns while it appears. The exit keeps turning the same way.</text><text x="32.0" y="721.9" font-size="14" fill="#F2F2FF">FlipIn() / FlipOut()</text><text x="282.7" y="721.9" font-size="14" fill="#F2F2FF">The block flips like a card, passing through the point where it is edge-on. The</text><text x="282.7" y="742.9" font-size="14" fill="#F2F2FF">exit flips back.</text><text x="32.0" y="779.9" font-size="14" fill="#F2F2FF">UnfoldIn() / UnfoldOut()</text><text x="282.7" y="779.9" font-size="14" fill="#F2F2FF">The block opens like a panel hinged to an edge. The exit folds back to the</text><text x="282.7" y="800.9" font-size="14" fill="#F2F2FF">same edge.</text><text x="32.0" y="837.9" font-size="14" fill="#F2F2FF">FlickerIn() / FlickerOut()</text><text x="282.7" y="837.9" font-size="14" fill="#F2F2FF">The block switches on, or off, flickering like a neon sign.</text><text x="32.0" y="874.9" font-size="14" fill="#F2F2FF">GlitchIn() / GlitchOut()</text><text x="282.7" y="874.9" font-size="14" fill="#F2F2FF">Sharp jumps in position, width and opacity, with no smooth movement.</text><rect x="24.5" y="240.0" width="751.0" height="648.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="916.1" font-size="16" fill="#F2F2FF">To leave the way it came, use the opposite exit: <tspan fill="#00F0FF" font-weight="700">Sequence(RiseIn(), DropOut())</tspan>.</text><circle cx="27.1" cy="945.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="951.2" font-size="17" fill="#B26BFF" font-weight="700">Ambient</text><clipPath id="table-clip-24-968"><rect x="24.0" y="968.0" width="752.0" height="296.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-968)"><rect x="24.0" y="968.0" width="752.0" height="296.0" fill="#0C0D1B"/><rect x="24.0" y="968.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="1042.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="1116.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="1190.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="1005.0" x2="776.0" y2="1005.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1042.0" x2="776.0" y2="1042.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1079.0" x2="776.0" y2="1079.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1116.0" x2="776.0" y2="1116.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1153.0" x2="776.0" y2="1153.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1190.0" x2="776.0" y2="1190.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="1227.0" x2="776.0" y2="1227.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="991.4" font-size="14" fill="#FF1F6E" font-weight="700">Animation</text><text x="282.7" y="991.4" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="1028.4" font-size="14" fill="#F2F2FF">Pulse()</text><text x="282.7" y="1028.4" font-size="14" fill="#F2F2FF">The block grows and shrinks gently, staying in place.</text><text x="32.0" y="1065.4" font-size="14" fill="#F2F2FF">Float()</text><text x="282.7" y="1065.4" font-size="14" fill="#F2F2FF">The block floats up and down.</text><text x="32.0" y="1102.4" font-size="14" fill="#F2F2FF">Sway()</text><text x="282.7" y="1102.4" font-size="14" fill="#F2F2FF">The block swings like a pendulum.</text><text x="32.0" y="1139.4" font-size="14" fill="#F2F2FF">Shake()</text><text x="282.7" y="1139.4" font-size="14" fill="#F2F2FF">The block shakes sideways and loses strength until it stops.</text><text x="32.0" y="1176.4" font-size="14" fill="#F2F2FF">Rotate()</text><text x="282.7" y="1176.4" font-size="14" fill="#F2F2FF">The block turns, a full turn by default.</text><text x="32.0" y="1213.4" font-size="14" fill="#F2F2FF">Drift()</text><text x="282.7" y="1213.4" font-size="14" fill="#F2F2FF">The block slides in a soft figure eight around its place.</text><text x="32.0" y="1250.4" font-size="14" fill="#F2F2FF">Jelly()</text><text x="282.7" y="1250.4" font-size="14" fill="#F2F2FF">The block stretches and squashes in turns, like jelly, until it settles.</text><rect x="24.5" y="968.5" width="751.0" height="295.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="1291.6" font-size="16" fill="#F2F2FF">Ambient animations play once by default. Use <tspan fill="#00F0FF" font-weight="700">loop_limit</tspan> to repeat them or make them infinite: see</text><text x="24.0" y="1315.6" font-size="16" fill="#F2F2FF">Repeating.</text><rect x="24.0" y="1332.0" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="1361.6" font-size="16" fill="#F2F2FF">Each preview below shows the code that produced it and replays by itself. People who turned on reduce</text><text x="24.0" y="1385.6" font-size="16" fill="#F2F2FF">motion in their system settings see the block without any animation.</text></g></g></g></svg>