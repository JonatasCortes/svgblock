<svg xmlns="http://www.w3.org/2000/svg" width="800" height="761.5" viewBox="0 0 800 761.5"><style>
@keyframes fadein-ac8a6a58 {
0% { opacity: 0; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); } 100% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
.fadein-ac8a6a58 {
  animation: fadein-ac8a6a58 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fadein-ac8a6a58 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="759.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="759.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Text Markers</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Wrap words in markers to style them inline. Each style has its own color in the theme.</text><clipPath id="table-clip-24-98"><rect x="24.0" y="98.0" width="752.0" height="185.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-98)"><rect x="24.0" y="98.0" width="752.0" height="185.0" fill="#0C0D1B"/><rect x="24.0" y="98.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="172.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="246.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="135.0" x2="776.0" y2="135.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="172.0" x2="776.0" y2="172.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="209.0" x2="776.0" y2="209.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="246.0" x2="776.0" y2="246.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="121.4" font-size="14" fill="#FF1F6E" font-weight="700">Marker</text><text x="237.1" y="121.4" font-size="14" fill="#FF1F6E" font-weight="700">Style</text><text x="442.2" y="121.4" font-size="14" fill="#FF1F6E" font-weight="700">Theme color</text><text x="707.6" y="121.4" font-size="14" fill="#FF1F6E" font-weight="700" text-anchor="middle">Result</text><text x="32.0" y="158.4" font-size="14" fill="#F2F2FF">**word**</text><text x="237.1" y="158.4" font-size="14" fill="#F2F2FF">Highlight (bold)</text><text x="442.2" y="158.4" font-size="14" fill="#F2F2FF">highlight</text><text x="707.6" y="158.4" font-size="14" fill="#F2F2FF" text-anchor="middle"><tspan fill="#00F0FF" font-weight="700">word</tspan></text><text x="32.0" y="195.4" font-size="14" fill="#F2F2FF">__word__</text><text x="237.1" y="195.4" font-size="14" fill="#F2F2FF">Underline</text><text x="442.2" y="195.4" font-size="14" fill="#F2F2FF">underline</text><text x="707.6" y="195.4" font-size="14" fill="#F2F2FF" text-anchor="middle"><tspan fill="#FF6BA8" text-decoration="underline">word</tspan></text><text x="32.0" y="232.4" font-size="14" fill="#F2F2FF">--word--</text><text x="237.1" y="232.4" font-size="14" fill="#F2F2FF">Strikethrough</text><text x="442.2" y="232.4" font-size="14" fill="#F2F2FF">strikethrough</text><text x="707.6" y="232.4" font-size="14" fill="#F2F2FF" text-anchor="middle"><tspan fill="#6A6D8F" text-decoration="line-through">word</tspan></text><text x="32.0" y="269.4" font-size="14" fill="#F2F2FF">##word##</text><text x="237.1" y="269.4" font-size="14" fill="#F2F2FF">Italic</text><text x="442.2" y="269.4" font-size="14" fill="#F2F2FF">italic</text><text x="707.6" y="269.4" font-size="14" fill="#F2F2FF" text-anchor="middle"><tspan fill="#C7B5FF" font-style="italic">word</tspan></text><rect x="24.5" y="98.5" width="751.0" height="184.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="305.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="311.7" font-size="17" fill="#B26BFF" font-weight="700">Combining markers</text><text x="24.0" y="346.1" font-size="16" fill="#F2F2FF">Markers can be combined and nested: <tspan fill="#00F0FF" font-weight="700">highlight and </tspan><tspan fill="#FF6BA8" font-weight="700" text-decoration="underline">underline</tspan><tspan fill="#00F0FF" font-weight="700"> together</tspan>, or <tspan fill="#C7B5FF" font-style="italic">italic with </tspan><tspan fill="#6A6D8F" font-style="italic" text-decoration="line-through">strikethrough</tspan></text><text x="24.0" y="370.1" font-size="16" fill="#F2F2FF"><tspan fill="#C7B5FF" font-style="italic">inside</tspan>. A word with several markers is drawn in the color of the innermost one, and highlight always adds</text><text x="24.0" y="394.1" font-size="16" fill="#F2F2FF">bold.</text><circle cx="27.1" cy="423.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="429.2" font-size="17" fill="#B26BFF" font-weight="700">Escaping</text><text x="24.0" y="463.6" font-size="16" fill="#F2F2FF">To show a literal marker, put a backslash before each of its characters: type \*\* to get **. A backslash</text><text x="24.0" y="487.6" font-size="16" fill="#F2F2FF">before any other character stays as it is.</text><text x="24.0" y="521.6" font-size="16" fill="#F2F2FF">Use a raw string (an r before the opening quote) so Python does not read the backslashes as escape</text><text x="24.0" y="545.6" font-size="16" fill="#F2F2FF">sequences.</text><circle cx="27.1" cy="574.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="580.7" font-size="17" fill="#B26BFF" font-weight="700">Good to know</text><text x="24.0" y="615.1" font-size="16" fill="#F2F2FF">• Every marker must be closed, otherwise svgblock raises a ValueError.</text><text x="24.0" y="649.1" font-size="16" fill="#F2F2FF">• Markers work in .text() and in table cells. Titles, subsections and table headers are drawn as plain bold</text><text x="24.0" y="673.1" font-size="16" fill="#F2F2FF">text, so markers show up literally there.</text><text x="24.0" y="707.1" font-size="16" fill="#F2F2FF">• Text that contains these pairs by accident, such as a double hyphen used as a dash or a name like</text><text x="24.0" y="731.1" font-size="16" fill="#F2F2FF">__init__, needs the backslash too.</text></g></g></g></svg>