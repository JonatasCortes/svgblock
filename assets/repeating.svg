</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="435" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="435" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Repeating</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">The ambient animations (<tspan fill="#00F0FF" font-weight="700">Pulse</tspan>, <tspan fill="#00F0FF" font-weight="700">Float</tspan>, <tspan fill="#00F0FF" font-weight="700">Sway</tspan>, <tspan fill="#00F0FF" font-weight="700">Shake</tspan>, <tspan fill="#00F0FF" font-weight="700">Rotate</tspan>, <tspan fill="#00F0FF" font-weight="700">Drift</tspan> and <tspan fill="#00F0FF" font-weight="700">Jelly</tspan>) and <tspan fill="#00F0FF" font-weight="700">Sequence</tspan> take</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">loop_limit</tspan>: the number of times they run again after the first run. The default is 0, which means they run</text><text x="24.0" y="129.6" font-size="16" fill="#F2F2FF">once.</text><clipPath id="table-clip-24-146"><rect x="24.0" y="146.0" width="752.0" height="185.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-146)"><rect x="24.0" y="146.0" width="752.0" height="185.0" fill="#0C0D1B"/><rect x="24.0" y="146.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="220.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="294.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="183.0" x2="776.0" y2="183.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="220.0" x2="776.0" y2="220.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="257.0" x2="776.0" y2="257.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="294.0" x2="776.0" y2="294.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="169.4" font-size="14" fill="#FF1F6E" font-weight="700">loop_limit</text><text x="220.0" y="169.4" font-size="14" fill="#FF1F6E" font-weight="700">Total runs</text><text x="32.0" y="206.4" font-size="14" fill="#F2F2FF">0 (default)</text><text x="220.0" y="206.4" font-size="14" fill="#F2F2FF">1</text><text x="32.0" y="243.4" font-size="14" fill="#F2F2FF">1</text><text x="220.0" y="243.4" font-size="14" fill="#F2F2FF">2</text><text x="32.0" y="280.4" font-size="14" fill="#F2F2FF">4</text><text x="220.0" y="280.4" font-size="14" fill="#F2F2FF">5</text><text x="32.0" y="317.4" font-size="14" fill="#F2F2FF">None</text><text x="220.0" y="317.4" font-size="14" fill="#F2F2FF">No limit: it never stops</text><rect x="24.5" y="146.5" width="751.0" height="184.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="358.6" font-size="16" fill="#F2F2FF">Entrances and exits play once and do not take loop_limit. To replay one, put it in a <tspan fill="#00F0FF" font-weight="700">Sequence</tspan> with a</text><text x="24.0" y="382.6" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">Show</tspan> step and make the sequence infinite with loop_limit=None. To replay an entrance and its exit, put</text><text x="24.0" y="406.6" font-size="16" fill="#F2F2FF">both in the sequence.</text></g></g></g></svg>