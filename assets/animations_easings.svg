<svg xmlns="http://www.w3.org/2000/svg" width="800" height="941" viewBox="0 0 800 941"><style>
@keyframes fade-f16f3800 {
0% { opacity: 0; transform: translate(0px, 0px) scale(1); } 100% { opacity: 1; transform: translate(0px, 0px) scale(1); }
}
.fade-f16f3800 {
  animation: fade-f16f3800 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fade-f16f3800 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="939" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="939" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Easings</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">An easing sets how the speed changes while an animation runs: it can start slow, end slow, go past the</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">final position and come back, or move in jumps. Pass one to the <tspan fill="#00F0FF" font-weight="700">easing</tspan> parameter of any animation, as in</text><text x="24.0" y="129.6" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">Rise(easing=EaseInOut())</tspan>.</text><clipPath id="table-clip-24-146"><rect x="24.0" y="146.0" width="752.0" height="354.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-146)"><rect x="24.0" y="146.0" width="752.0" height="354.0" fill="#0C0D1B"/><rect x="24.0" y="146.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="220.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="294.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="389.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="463.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="183.0" x2="776.0" y2="183.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="220.0" x2="776.0" y2="220.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="257.0" x2="776.0" y2="257.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="294.0" x2="776.0" y2="294.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="331.0" x2="776.0" y2="331.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="389.0" x2="776.0" y2="389.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="426.0" x2="776.0" y2="426.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="463.0" x2="776.0" y2="463.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="169.4" font-size="14" fill="#FF1F6E" font-weight="700">Easing</text><text x="305.5" y="169.4" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="206.4" font-size="14" fill="#F2F2FF">Linear()</text><text x="305.5" y="206.4" font-size="14" fill="#F2F2FF">Constant speed from start to end.</text><text x="32.0" y="243.4" font-size="14" fill="#F2F2FF">EaseIn()</text><text x="305.5" y="243.4" font-size="14" fill="#F2F2FF">Starts slow and speeds up.</text><text x="32.0" y="280.4" font-size="14" fill="#F2F2FF">EaseOut()</text><text x="305.5" y="280.4" font-size="14" fill="#F2F2FF">Starts fast and slows down until it stops. The default of <tspan fill="#00F0FF" font-weight="700">Fade</tspan>.</text><text x="32.0" y="317.4" font-size="14" fill="#F2F2FF">EaseInOut()</text><text x="305.5" y="317.4" font-size="14" fill="#F2F2FF">Slow at the start and at the end, fast in the middle. The default of <tspan fill="#00F0FF" font-weight="700">Pulse</tspan>.</text><text x="32.0" y="354.4" font-size="14" fill="#F2F2FF">EaseOutQuint()</text><text x="305.5" y="354.4" font-size="14" fill="#F2F2FF">Starts very fast and settles slowly, like a soft landing. The default of <tspan fill="#00F0FF" font-weight="700">Rise</tspan></text><text x="305.5" y="375.4" font-size="14" fill="#F2F2FF">and <tspan fill="#00F0FF" font-weight="700">Drop</tspan>.</text><text x="32.0" y="412.4" font-size="14" fill="#F2F2FF">EaseOutBack()</text><text x="305.5" y="412.4" font-size="14" fill="#F2F2FF">Goes a little past the final value and then comes back. The default of <tspan fill="#00F0FF" font-weight="700">Pop</tspan>.</text><text x="32.0" y="449.4" font-size="14" fill="#F2F2FF">CubicBezier(x1, y1, x2, y2)</text><text x="305.5" y="449.4" font-size="14" fill="#F2F2FF">A curve of your own. See below.</text><text x="32.0" y="486.4" font-size="14" fill="#F2F2FF">Steps(count)</text><text x="305.5" y="486.4" font-size="14" fill="#F2F2FF">Jumps between that many equal steps instead of moving smoothly.</text><rect x="24.5" y="146.5" width="751.0" height="353.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="522.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="528.7" font-size="17" fill="#B26BFF" font-weight="700">Custom curves</text><text x="24.0" y="563.1" font-size="16" fill="#F2F2FF">Picture a graph where the horizontal axis is time (0 is the start, 1 is the end) and the vertical axis is</text><text x="24.0" y="587.1" font-size="16" fill="#F2F2FF">progress (0 is where the animation starts, 1 is where it ends). The curve goes from the bottom left to the</text><text x="24.0" y="611.1" font-size="16" fill="#F2F2FF">top right and is bent by two control points: <tspan fill="#00F0FF" font-weight="700">(x1, y1)</tspan> pulls the beginning of the curve and <tspan fill="#00F0FF" font-weight="700">(x2, y2)</tspan> pulls its</text><text x="24.0" y="635.1" font-size="16" fill="#F2F2FF">end.</text><text x="24.0" y="669.1" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">x1</tspan> and <tspan fill="#00F0FF" font-weight="700">x2</tspan> must be between 0 and 1.</text><text x="24.0" y="703.1" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">y1</tspan> and <tspan fill="#00F0FF" font-weight="700">y2</tspan> can be any number. A value below 0 or above 1 makes the animation go past its limits and</text><text x="24.0" y="727.1" font-size="16" fill="#F2F2FF">come back.</text><text x="24.0" y="761.1" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">CubicBezier(0, 0, 1, 1)</tspan> is a straight line, the same as Linear().</text><circle cx="27.1" cy="790.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="796.2" font-size="17" fill="#B26BFF" font-weight="700">Good to know</text><text x="24.0" y="830.6" font-size="16" fill="#F2F2FF">• An easing is an object, never a text: write easing=EaseOut(), not easing="ease-out".</text><text x="24.0" y="864.6" font-size="16" fill="#F2F2FF">• In a sequence, each step keeps its own easing. <tspan fill="#00F0FF" font-weight="700">Show</tspan> and <tspan fill="#00F0FF" font-weight="700">Hide</tspan> have no easing.</text><rect x="24.0" y="881.0" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="910.6" font-size="16" fill="#F2F2FF">Examples are shown below. Each box shows the code that produced it.</text></g></g></g></svg>