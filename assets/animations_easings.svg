<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1576.5" viewBox="0 0 800 1576.5"><style>
@keyframes fadein-ac8a6a58 {
0% { opacity: 0; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); } 100% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
.fadein-ac8a6a58 {
  animation: fadein-ac8a6a58 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fadein-ac8a6a58 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1574.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1574.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Easings</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">An easing sets how the speed changes while an animation runs: it can start slow, end slow, go past the</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">final position and come back, bounce, or move in jumps. Pass one to the <tspan fill="#00F0FF" font-weight="700">easing</tspan> parameter of an</text><text x="24.0" y="129.6" font-size="16" fill="#F2F2FF">animation, as in <tspan fill="#00F0FF" font-weight="700">RiseIn(easing=EaseInOut())</tspan>. The default of each animation is in Parameters.</text><circle cx="27.1" cy="158.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="164.7" font-size="17" fill="#B26BFF" font-weight="700">Basic</text><clipPath id="table-clip-24-182"><rect x="24.0" y="181.5" width="752.0" height="280.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-182)"><rect x="24.0" y="181.5" width="752.0" height="280.0" fill="#0C0D1B"/><rect x="24.0" y="181.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="255.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="329.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="403.5" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="218.5" x2="776.0" y2="218.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="255.5" x2="776.0" y2="255.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="292.5" x2="776.0" y2="292.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="329.5" x2="776.0" y2="329.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="366.5" x2="776.0" y2="366.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="403.5" x2="776.0" y2="403.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="204.9" font-size="14" fill="#FF1F6E" font-weight="700">Easing</text><text x="305.5" y="204.9" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="241.9" font-size="14" fill="#F2F2FF">Linear()</text><text x="305.5" y="241.9" font-size="14" fill="#F2F2FF">Constant speed from start to end.</text><text x="32.0" y="278.9" font-size="14" fill="#F2F2FF">EaseIn()</text><text x="305.5" y="278.9" font-size="14" fill="#F2F2FF">Starts slow and speeds up.</text><text x="32.0" y="315.9" font-size="14" fill="#F2F2FF">EaseOut()</text><text x="305.5" y="315.9" font-size="14" fill="#F2F2FF">Starts fast and slows down until it stops.</text><text x="32.0" y="352.9" font-size="14" fill="#F2F2FF">EaseInOut()</text><text x="305.5" y="352.9" font-size="14" fill="#F2F2FF">Slow at the start and at the end, fast in the middle.</text><text x="32.0" y="389.9" font-size="14" fill="#F2F2FF">CubicBezier(x1, y1, x2, y2)</text><text x="305.5" y="389.9" font-size="14" fill="#F2F2FF">A curve of your own. See below.</text><text x="32.0" y="426.9" font-size="14" fill="#F2F2FF">Steps(count, jump)</text><text x="305.5" y="426.9" font-size="14" fill="#F2F2FF">Jumps between that many equal steps instead of moving smoothly. <tspan fill="#00F0FF" font-weight="700">jump</tspan></text><text x="305.5" y="447.9" font-size="14" fill="#F2F2FF">is where the jumps happen: <tspan fill="#00F0FF" font-weight="700">end</tspan> (the default), <tspan fill="#00F0FF" font-weight="700">start</tspan>, <tspan fill="#00F0FF" font-weight="700">none</tspan> or <tspan fill="#00F0FF" font-weight="700">both</tspan>.</text><rect x="24.5" y="182.0" width="751.0" height="279.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="484.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="490.2" font-size="17" fill="#B26BFF" font-weight="700">Families</text><text x="24.0" y="524.6" font-size="16" fill="#F2F2FF">Each family comes in three forms: <tspan fill="#00F0FF" font-weight="700">In</tspan> starts slow, <tspan fill="#00F0FF" font-weight="700">Out</tspan> ends slow and <tspan fill="#00F0FF" font-weight="700">InOut</tspan> does both. The name is the</text><text x="24.0" y="548.6" font-size="16" fill="#F2F2FF">family plus the form, as in <tspan fill="#00F0FF" font-weight="700">EaseOutCubic()</tspan> or <tspan fill="#00F0FF" font-weight="700">EaseInOutBack()</tspan>.</text><clipPath id="table-clip-24-565"><rect x="24.0" y="565.0" width="752.0" height="259.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-565)"><rect x="24.0" y="565.0" width="752.0" height="259.0" fill="#0C0D1B"/><rect x="24.0" y="565.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="639.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="713.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="787.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="602.0" x2="776.0" y2="602.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="639.0" x2="776.0" y2="639.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="676.0" x2="776.0" y2="676.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="713.0" x2="776.0" y2="713.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="750.0" x2="776.0" y2="750.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="787.0" x2="776.0" y2="787.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="588.4" font-size="14" fill="#FF1F6E" font-weight="700">Family</text><text x="182.4" y="588.4" font-size="14" fill="#FF1F6E" font-weight="700">Character</text><text x="32.0" y="625.4" font-size="14" fill="#F2F2FF">Sine</text><text x="182.4" y="625.4" font-size="14" fill="#F2F2FF">The gentlest curve. Subtle and natural.</text><text x="32.0" y="662.4" font-size="14" fill="#F2F2FF">Cubic</text><text x="182.4" y="662.4" font-size="14" fill="#F2F2FF">A moderate curve that suits most movements.</text><text x="32.0" y="699.4" font-size="14" fill="#F2F2FF">Quint</text><text x="182.4" y="699.4" font-size="14" fill="#F2F2FF">A strong curve: the Out form starts very fast and settles slowly.</text><text x="32.0" y="736.4" font-size="14" fill="#F2F2FF">Expo</text><text x="182.4" y="736.4" font-size="14" fill="#F2F2FF">The strongest: nearly all the movement happens in a short part of the run.</text><text x="32.0" y="773.4" font-size="14" fill="#F2F2FF">Circ</text><text x="182.4" y="773.4" font-size="14" fill="#F2F2FF">Follows a circular arc, so it speeds up or stops more abruptly than Cubic.</text><text x="32.0" y="810.4" font-size="14" fill="#F2F2FF">Back</text><text x="182.4" y="810.4" font-size="14" fill="#F2F2FF">Goes past the limit and comes back. <tspan fill="#00F0FF" font-weight="700">In</tspan> pulls back before moving, <tspan fill="#00F0FF" font-weight="700">Out</tspan> overshoots the end.</text><rect x="24.5" y="565.5" width="751.0" height="258.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="846.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="852.7" font-size="17" fill="#B26BFF" font-weight="700">Physical</text><clipPath id="table-clip-24-870"><rect x="24.0" y="869.5" width="752.0" height="174.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-870)"><rect x="24.0" y="869.5" width="752.0" height="174.0" fill="#0C0D1B"/><rect x="24.0" y="869.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="964.5" width="752.0" height="79.0" fill="#101125"/></g><line x1="24.0" y1="906.5" x2="776.0" y2="906.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="964.5" x2="776.0" y2="964.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="892.9" font-size="14" fill="#FF1F6E" font-weight="700">Easing</text><text x="305.5" y="892.9" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="929.9" font-size="14" fill="#F2F2FF">Spring(bounce)</text><text x="305.5" y="929.9" font-size="14" fill="#F2F2FF">Overshoots the end and oscillates around it until it settles, like a spring.</text><text x="305.5" y="950.9" font-size="14" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">bounce</tspan> is between 0 and 0.9 (default 0.5): a larger value oscillates more.</text><text x="32.0" y="987.9" font-size="14" fill="#F2F2FF">Bounce(bounces, rebound)</text><text x="305.5" y="987.9" font-size="14" fill="#F2F2FF">Reaches the end and bounces back from it, like a dropped ball. <tspan fill="#00F0FF" font-weight="700">bounces</tspan></text><text x="305.5" y="1008.9" font-size="14" fill="#F2F2FF">is how many bounces (default 3) and <tspan fill="#00F0FF" font-weight="700">rebound</tspan> is how much of the height</text><text x="305.5" y="1029.9" font-size="14" fill="#F2F2FF">each one keeps, between 0 and 1 (default 0.5).</text><rect x="24.5" y="870.0" width="751.0" height="173.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="1066.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="1072.2" font-size="17" fill="#B26BFF" font-weight="700">Custom curves</text><text x="24.0" y="1106.6" font-size="16" fill="#F2F2FF">Picture a graph where the horizontal axis is time (0 is the start, 1 is the end) and the vertical axis is</text><text x="24.0" y="1130.6" font-size="16" fill="#F2F2FF">progress (0 is where the animation starts, 1 is where it ends). The curve goes from the bottom left to the</text><text x="24.0" y="1154.6" font-size="16" fill="#F2F2FF">top right and is bent by two control points: <tspan fill="#00F0FF" font-weight="700">(x1, y1)</tspan> pulls the beginning of the curve and <tspan fill="#00F0FF" font-weight="700">(x2, y2)</tspan> pulls its</text><text x="24.0" y="1178.6" font-size="16" fill="#F2F2FF">end.</text><text x="24.0" y="1212.6" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">x1</tspan> and <tspan fill="#00F0FF" font-weight="700">x2</tspan> must be between 0 and 1.</text><text x="24.0" y="1246.6" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">y1</tspan> and <tspan fill="#00F0FF" font-weight="700">y2</tspan> can be any number. A value below 0 or above 1 makes the animation go past its limits and</text><text x="24.0" y="1270.6" font-size="16" fill="#F2F2FF">come back.</text><text x="24.0" y="1304.6" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">CubicBezier(0, 0, 1, 1)</tspan> is a straight line, the same as Linear().</text><circle cx="27.1" cy="1333.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="1339.7" font-size="17" fill="#B26BFF" font-weight="700">Good to know</text><text x="24.0" y="1374.1" font-size="16" fill="#F2F2FF">• An easing is an object, never a text: write easing=EaseOut(), not easing="ease-out".</text><text x="24.0" y="1408.1" font-size="16" fill="#F2F2FF">• In a sequence, each step keeps its own easing. <tspan fill="#00F0FF" font-weight="700">Show</tspan> and <tspan fill="#00F0FF" font-weight="700">Hide</tspan> have none.</text><text x="24.0" y="1442.1" font-size="16" fill="#F2F2FF">• Easings that go past their limits, such as the Back family and Spring, cannot be used where the blur</text><text x="24.0" y="1466.1" font-size="16" fill="#F2F2FF">would go below 0: <tspan fill="#00F0FF" font-weight="700">FocusIn</tspan>, <tspan fill="#00F0FF" font-weight="700">FocusOut</tspan> and animations with focus=True raise a ValueError.</text><text x="24.0" y="1500.1" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">Spring</tspan> and <tspan fill="#00F0FF" font-weight="700">Bounce</tspan> are drawn with the CSS linear() function, so they need a recent browser.</text><rect x="24.0" y="1516.5" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="1546.1" font-size="16" fill="#F2F2FF">Examples are shown below. Each box shows the code that produced it.</text></g></g></g></svg>