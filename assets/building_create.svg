<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500.5" viewBox="0 0 800 500.5"><style>
@keyframes entry {
  from { opacity: 0; } to { opacity: 1; transform: none; }
}
.entry {
  animation: entry 0.8s ease-out both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .entry { animation: none; }
}
</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="498.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="498.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Building a Block</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Everything in svgblock revolves around one class, <tspan fill="#00F0FF" font-weight="700">Block</tspan>. You create it, add content with chained</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">methods and save it.</text><circle cx="27.1" cy="134.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="140.7" font-size="17" fill="#B26BFF" font-weight="700">Creating a block</text><clipPath id="table-clip-24-158"><rect x="24.0" y="157.5" width="752.0" height="285.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-158)"><rect x="24.0" y="157.5" width="752.0" height="285.0" fill="#0C0D1B"/><rect x="24.0" y="157.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="231.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="326.5" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="194.5" x2="776.0" y2="194.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="231.5" x2="776.0" y2="231.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="268.5" x2="776.0" y2="268.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="326.5" x2="776.0" y2="326.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="384.5" x2="776.0" y2="384.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">Parameter</text><text x="259.0" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700" text-anchor="middle">Default</text><text x="314.0" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="217.9" font-size="14" fill="#F2F2FF">theme</text><text x="259.0" y="217.9" font-size="14" fill="#F2F2FF" text-anchor="middle">"red"</text><text x="314.0" y="217.9" font-size="14" fill="#F2F2FF">The name of the theme, which defines every color. See Themes.</text><text x="32.0" y="254.9" font-size="14" fill="#F2F2FF">width</text><text x="259.0" y="254.9" font-size="14" fill="#F2F2FF" text-anchor="middle">800</text><text x="314.0" y="254.9" font-size="14" fill="#F2F2FF">The width of the block, in pixels. The height is calculated for you.</text><text x="32.0" y="291.9" font-size="14" fill="#F2F2FF">animation</text><text x="259.0" y="291.9" font-size="14" fill="#F2F2FF" text-anchor="middle">None</text><text x="314.0" y="291.9" font-size="14" fill="#F2F2FF">The entrance animation. Optional: without it the block is static. See</text><text x="314.0" y="312.9" font-size="14" fill="#F2F2FF">Animations.</text><text x="32.0" y="349.9" font-size="14" fill="#F2F2FF">animation_loop</text><text x="259.0" y="349.9" font-size="14" fill="#F2F2FF" text-anchor="middle">None</text><text x="314.0" y="349.9" font-size="14" fill="#F2F2FF">Seconds between replays of the animation. Without it the animation</text><text x="314.0" y="370.9" font-size="14" fill="#F2F2FF">plays once. See Animations.</text><text x="32.0" y="407.9" font-size="14" fill="#F2F2FF">frame</text><text x="259.0" y="407.9" font-size="14" fill="#F2F2FF" text-anchor="middle">✓</text><text x="314.0" y="407.9" font-size="14" fill="#F2F2FF">Draws the border and the background. With False, only the content is</text><text x="314.0" y="428.9" font-size="14" fill="#F2F2FF">drawn.</text><rect x="24.5" y="158.0" width="751.0" height="284.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="470.1" font-size="16" fill="#F2F2FF">All parameters are optional. Block() alone already works and gives you a static block.</text></g></g></svg>