</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="543.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="543.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Building a Block</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Everything in svgblock revolves around one class, <tspan fill="#00F0FF" font-weight="700">Block</tspan>. You create it, add content with chained</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">methods and save it.</text><circle cx="27.1" cy="134.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="140.7" font-size="17" fill="#B26BFF" font-weight="700">Creating a block</text><clipPath id="table-clip-24-158"><rect x="24.0" y="157.5" width="752.0" height="306.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-158)"><rect x="24.0" y="157.5" width="752.0" height="306.0" fill="#0C0D1B"/><rect x="24.0" y="157.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="252.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="347.5" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="194.5" x2="776.0" y2="194.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="252.5" x2="776.0" y2="252.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="289.5" x2="776.0" y2="289.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="347.5" x2="776.0" y2="347.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="405.5" x2="776.0" y2="405.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">Parameter</text><text x="274.7" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700" text-anchor="middle">Default</text><text x="366.2" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="217.9" font-size="14" fill="#F2F2FF">theme</text><text x="274.7" y="217.9" font-size="14" fill="#F2F2FF" text-anchor="middle">Theme.NEON</text><text x="366.2" y="217.9" font-size="14" fill="#F2F2FF">A member of the Theme enum, or your own ThemeData. It</text><text x="366.2" y="238.9" font-size="14" fill="#F2F2FF">defines every color. See Themes.</text><text x="32.0" y="275.9" font-size="14" fill="#F2F2FF">width</text><text x="274.7" y="275.9" font-size="14" fill="#F2F2FF" text-anchor="middle">800</text><text x="366.2" y="275.9" font-size="14" fill="#F2F2FF">The width of the block, in pixels. The height is calculated for you.</text><text x="32.0" y="312.9" font-size="14" fill="#F2F2FF">padding</text><text x="274.7" y="312.9" font-size="14" fill="#F2F2FF" text-anchor="middle">24</text><text x="366.2" y="312.9" font-size="14" fill="#F2F2FF">The space between the border and the content, in pixels. It is 0</text><text x="366.2" y="333.9" font-size="14" fill="#F2F2FF">when hide_frame is True.</text><text x="32.0" y="370.9" font-size="14" fill="#F2F2FF">animation</text><text x="274.7" y="370.9" font-size="14" fill="#F2F2FF" text-anchor="middle">None</text><text x="366.2" y="370.9" font-size="14" fill="#F2F2FF">How the block moves: an animation such as Rise() or a</text><text x="366.2" y="391.9" font-size="14" fill="#F2F2FF">Sequence(...). Without it the block is static. See Animations.</text><text x="32.0" y="428.9" font-size="14" fill="#F2F2FF">hide_frame</text><text x="274.7" y="428.9" font-size="14" fill="#F2F2FF" text-anchor="middle">False</text><text x="366.2" y="428.9" font-size="14" fill="#F2F2FF">Hides the border and the background. With True, only the</text><text x="366.2" y="449.9" font-size="14" fill="#F2F2FF">content is drawn.</text><rect x="24.5" y="158.0" width="751.0" height="305.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="491.1" font-size="16" fill="#F2F2FF">Every parameter is optional: Block() alone gives you a static block. Pass them by name, as in</text><text x="24.0" y="515.1" font-size="16" fill="#F2F2FF">Block(width=900, animation=Rise()).</text></g></g></g></svg>