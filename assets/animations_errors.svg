<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1506.5" viewBox="0 0 800 1506.5"><style>
@keyframes fadein-ac8a6a58 {
0% { opacity: 0; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); } 100% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
.fadein-ac8a6a58 {
  animation: fadein-ac8a6a58 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fadein-ac8a6a58 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1504.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1504.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Errors</text><clipPath id="table-clip-24-64"><rect x="24.0" y="64.0" width="752.0" height="987.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-64)"><rect x="24.0" y="64.0" width="752.0" height="987.0" fill="#0C0D1B"/><rect x="24.0" y="64.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="138.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="212.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="307.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="402.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="476.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="571.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="666.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="761.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="877.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="993.0" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="101.0" x2="776.0" y2="101.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="138.0" x2="776.0" y2="138.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="175.0" x2="776.0" y2="175.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="212.0" x2="776.0" y2="212.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="270.0" x2="776.0" y2="270.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="307.0" x2="776.0" y2="307.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="344.0" x2="776.0" y2="344.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="402.0" x2="776.0" y2="402.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="439.0" x2="776.0" y2="439.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="476.0" x2="776.0" y2="476.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="513.0" x2="776.0" y2="513.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="571.0" x2="776.0" y2="571.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="629.0" x2="776.0" y2="629.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="666.0" x2="776.0" y2="666.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="703.0" x2="776.0" y2="703.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="761.0" x2="776.0" y2="761.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="819.0" x2="776.0" y2="819.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="877.0" x2="776.0" y2="877.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="935.0" x2="776.0" y2="935.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="993.0" x2="776.0" y2="993.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="87.4" font-size="14" fill="#FF1F6E" font-weight="700">Situation</text><text x="408.0" y="87.4" font-size="14" fill="#FF1F6E" font-weight="700">What happens</text><text x="32.0" y="124.4" font-size="14" fill="#F2F2FF">duration is 0 or negative</text><text x="408.0" y="124.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="161.4" font-size="14" fill="#F2F2FF">distance is negative</text><text x="408.0" y="161.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="198.4" font-size="14" fill="#F2F2FF">start_scale is 0, negative or greater than 1</text><text x="408.0" y="198.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="235.4" font-size="14" fill="#F2F2FF">scale, amount, intensity, radius, blur or the angle of Sway</text><text x="32.0" y="256.4" font-size="14" fill="#F2F2FF">is 0 or negative</text><text x="408.0" y="235.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="293.4" font-size="14" fill="#F2F2FF">amount of Jelly is not between 0 and 1</text><text x="408.0" y="293.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="330.4" font-size="14" fill="#F2F2FF">angle of Rotate is 0</text><text x="408.0" y="330.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="367.4" font-size="14" fill="#F2F2FF">flickers, shakes or wobbles is not a whole number of 1 or</text><text x="32.0" y="388.4" font-size="14" fill="#F2F2FF">more</text><text x="408.0" y="367.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="425.4" font-size="14" fill="#F2F2FF">axis, edge, pivot or direction is not one of its listed values</text><text x="408.0" y="425.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="462.4" font-size="14" fill="#F2F2FF">loop_limit is negative or greater than 1000</text><text x="408.0" y="462.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="499.4" font-size="14" fill="#F2F2FF">x1 or x2 of CubicBezier is outside 0 to 1</text><text x="408.0" y="499.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="536.4" font-size="14" fill="#F2F2FF">count of Steps is not a whole number of 1 or more, or</text><text x="32.0" y="557.4" font-size="14" fill="#F2F2FF">jump is not start, end, none or both</text><text x="408.0" y="536.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="594.4" font-size="14" fill="#F2F2FF">bounce of Spring, or bounces or rebound of Bounce, is</text><text x="32.0" y="615.4" font-size="14" fill="#F2F2FF">out of range</text><text x="408.0" y="594.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="652.4" font-size="14" fill="#F2F2FF">An overshooting easing on an animation with blur</text><text x="408.0" y="652.4" font-size="14" fill="#F2F2FF">ValueError: the blur would go below 0.</text><text x="32.0" y="689.4" font-size="14" fill="#F2F2FF">loop_limit passed to an entrance, an exit, Show or Hide</text><text x="408.0" y="689.4" font-size="14" fill="#F2F2FF">TypeError: these animations do not accept it.</text><text x="32.0" y="726.4" font-size="14" fill="#F2F2FF">easing passed to PopIn, PopOut, FlickerIn, FlickerOut,</text><text x="32.0" y="747.4" font-size="14" fill="#F2F2FF">GlitchIn, GlitchOut, Show or Hide</text><text x="408.0" y="726.4" font-size="14" fill="#F2F2FF">TypeError: their timing is fixed.</text><text x="32.0" y="784.4" font-size="14" fill="#F2F2FF">fade or focus passed to an animation that has no such</text><text x="32.0" y="805.4" font-size="14" fill="#F2F2FF">parameter, such as FadeIn</text><text x="408.0" y="784.4" font-size="14" fill="#F2F2FF">TypeError.</text><text x="32.0" y="842.4" font-size="14" fill="#F2F2FF">An easing that is not an easing object, such as</text><text x="32.0" y="863.4" font-size="14" fill="#F2F2FF">easing="ease-out" or easing=EaseOut</text><text x="408.0" y="842.4" font-size="14" fill="#F2F2FF">TypeError.</text><text x="32.0" y="900.4" font-size="14" fill="#F2F2FF">A sequence step that is not an animation, such as RiseIn</text><text x="32.0" y="921.4" font-size="14" fill="#F2F2FF">without parentheses</text><text x="408.0" y="900.4" font-size="14" fill="#F2F2FF">TypeError.</text><text x="32.0" y="958.4" font-size="14" fill="#F2F2FF">An infinite animation that is not the last step of a</text><text x="32.0" y="979.4" font-size="14" fill="#F2F2FF">sequence</text><text x="408.0" y="958.4" font-size="14" fill="#F2F2FF">ValueError: the steps after it would never play.</text><text x="32.0" y="1016.4" font-size="14" fill="#F2F2FF">A sequence that, once unrolled, has more than 10,000</text><text x="32.0" y="1037.4" font-size="14" fill="#F2F2FF">steps</text><text x="408.0" y="1016.4" font-size="14" fill="#F2F2FF">ValueError: reduce a loop_limit or use None.</text><rect x="24.5" y="64.5" width="751.0" height="986.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="1073.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="1079.7" font-size="17" fill="#B26BFF" font-weight="700">Good to know</text><text x="24.0" y="1114.1" font-size="16" fill="#F2F2FF">• The animation moves the whole block, border and content together. With hide_frame=True, only the</text><text x="24.0" y="1138.1" font-size="16" fill="#F2F2FF">content moves.</text><text x="24.0" y="1172.1" font-size="16" fill="#F2F2FF">• The block is only visible inside the image. Entrances and exits come from outside it, so they can start</text><text x="24.0" y="1196.1" font-size="16" fill="#F2F2FF">or end cropped by its edge. With fade=False and a large distance, the block slides in from the edge. The</text><text x="24.0" y="1220.1" font-size="16" fill="#F2F2FF">blur of an entrance or exit can also be cropped by the edge of the image.</text><text x="24.0" y="1254.1" font-size="16" fill="#F2F2FF">• Animations that make the block bigger than its normal size get room inside the image, so the block</text><text x="24.0" y="1278.1" font-size="16" fill="#F2F2FF">rests slightly smaller than width and is never cropped. This includes <tspan fill="#00F0FF" font-weight="700">Pulse</tspan>, <tspan fill="#00F0FF" font-weight="700">Jelly</tspan>, <tspan fill="#00F0FF" font-weight="700">GlitchIn</tspan> and <tspan fill="#00F0FF" font-weight="700">GlitchOut</tspan></text><text x="24.0" y="1302.1" font-size="16" fill="#F2F2FF">(which stretch the block by 5%), and <tspan fill="#00F0FF" font-weight="700">ZoomIn</tspan> or <tspan fill="#00F0FF" font-weight="700">ZoomOut</tspan> with a scale above 1.</text><text x="24.0" y="1336.1" font-size="16" fill="#F2F2FF">• Ambient animations are always in view, so they also get room for their movement, rotation and blur,</text><text x="24.0" y="1360.1" font-size="16" fill="#F2F2FF">and the block rests smaller than width. A <tspan fill="#00F0FF" font-weight="700">Rotate</tspan> needs room for a whole circle, so the block rests</text><text x="24.0" y="1384.1" font-size="16" fill="#F2F2FF">noticeably smaller and the image gets taller. In a sequence, the room fits the step that needs the most.</text><text x="24.0" y="1408.1" font-size="16" fill="#F2F2FF">The image keeps the width you passed.</text><text x="24.0" y="1442.1" font-size="16" fill="#F2F2FF">• Without a loop, an animation plays once when the image loads. Reload the page to see it again.</text><text x="24.0" y="1476.1" font-size="16" fill="#F2F2FF">• Some image viewers and editors do not run animations. Open the file in a browser to check.</text></g></g></g></svg>