<svg xmlns="http://www.w3.org/2000/svg" width="800" height="917.5" viewBox="0 0 800 917.5"><style>
@keyframes fade-f16f3800 {
0% { opacity: 0; transform: translate(0px, 0px) scale(1); } 100% { opacity: 1; transform: translate(0px, 0px) scale(1); }
}
.fade-f16f3800 {
  animation: fade-f16f3800 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fade-f16f3800 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="915.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="915.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Errors</text><clipPath id="table-clip-24-64"><rect x="24.0" y="64.0" width="752.0" height="528.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-64)"><rect x="24.0" y="64.0" width="752.0" height="528.0" fill="#0C0D1B"/><rect x="24.0" y="64.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="138.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="212.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="286.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="360.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="476.0" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="101.0" x2="776.0" y2="101.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="138.0" x2="776.0" y2="138.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="175.0" x2="776.0" y2="175.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="212.0" x2="776.0" y2="212.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="249.0" x2="776.0" y2="249.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="286.0" x2="776.0" y2="286.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="323.0" x2="776.0" y2="323.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="360.0" x2="776.0" y2="360.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="418.0" x2="776.0" y2="418.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="476.0" x2="776.0" y2="476.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="534.0" x2="776.0" y2="534.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="87.4" font-size="14" fill="#FF1F6E" font-weight="700">Situation</text><text x="408.0" y="87.4" font-size="14" fill="#FF1F6E" font-weight="700">What happens</text><text x="32.0" y="124.4" font-size="14" fill="#F2F2FF">duration is 0 or negative</text><text x="408.0" y="124.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="161.4" font-size="14" fill="#F2F2FF">distance is negative</text><text x="408.0" y="161.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="198.4" font-size="14" fill="#F2F2FF">start_scale or amount is 0 or negative</text><text x="408.0" y="198.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="235.4" font-size="14" fill="#F2F2FF">loop_limit is negative or greater than 1000</text><text x="408.0" y="235.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="272.4" font-size="14" fill="#F2F2FF">x1 or x2 of CubicBezier is outside 0 to 1</text><text x="408.0" y="272.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="309.4" font-size="14" fill="#F2F2FF">count of Steps is not a whole number of 1 or more</text><text x="408.0" y="309.4" font-size="14" fill="#F2F2FF">ValueError.</text><text x="32.0" y="346.4" font-size="14" fill="#F2F2FF">loop_limit passed to Fade, Rise, Drop or Pop</text><text x="408.0" y="346.4" font-size="14" fill="#F2F2FF">TypeError: these animations do not accept it.</text><text x="32.0" y="383.4" font-size="14" fill="#F2F2FF">An easing that is not an easing object, such as</text><text x="32.0" y="404.4" font-size="14" fill="#F2F2FF">easing="ease-out" or easing=EaseOut</text><text x="408.0" y="383.4" font-size="14" fill="#F2F2FF">TypeError.</text><text x="32.0" y="441.4" font-size="14" fill="#F2F2FF">A sequence step that is not an animation, such as Rise</text><text x="32.0" y="462.4" font-size="14" fill="#F2F2FF">without parentheses</text><text x="408.0" y="441.4" font-size="14" fill="#F2F2FF">TypeError.</text><text x="32.0" y="499.4" font-size="14" fill="#F2F2FF">An infinite animation that is not the last step of a</text><text x="32.0" y="520.4" font-size="14" fill="#F2F2FF">sequence</text><text x="408.0" y="499.4" font-size="14" fill="#F2F2FF">ValueError: the steps after it would never play.</text><text x="32.0" y="557.4" font-size="14" fill="#F2F2FF">A sequence that, once unrolled, has more than 10,000</text><text x="32.0" y="578.4" font-size="14" fill="#F2F2FF">steps</text><text x="408.0" y="557.4" font-size="14" fill="#F2F2FF">ValueError: reduce a loop_limit or use None.</text><rect x="24.5" y="64.5" width="751.0" height="527.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="614.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="620.7" font-size="17" fill="#B26BFF" font-weight="700">Good to know</text><text x="24.0" y="655.1" font-size="16" fill="#F2F2FF">• The animation moves the whole block, border and content together. With hide_frame=True, only the</text><text x="24.0" y="679.1" font-size="16" fill="#F2F2FF">content moves.</text><text x="24.0" y="713.1" font-size="16" fill="#F2F2FF">• The block is only visible inside the image. With fade=False and a large distance, the block starts</text><text x="24.0" y="737.1" font-size="16" fill="#F2F2FF">outside the image and slides in from its edge.</text><text x="24.0" y="771.1" font-size="16" fill="#F2F2FF">• Animations that make the block grow, such as Pulse, get room inside the image: the block rests slightly</text><text x="24.0" y="795.1" font-size="16" fill="#F2F2FF">smaller than width, so it is never cropped. In a sequence, the room fits the step that grows the most. The</text><text x="24.0" y="819.1" font-size="16" fill="#F2F2FF">image keeps the width you passed.</text><text x="24.0" y="853.1" font-size="16" fill="#F2F2FF">• Without a loop, an animation plays once when the image loads. Reload the page to see it again.</text><text x="24.0" y="887.1" font-size="16" fill="#F2F2FF">• Some image viewers and editors do not run animations. Open the file in a browser to check.</text></g></g></g></svg>