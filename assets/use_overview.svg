<svg xmlns="http://www.w3.org/2000/svg" width="800" height="229.5" viewBox="0 0 800 229.5"><style>
@keyframes entry {
  from { opacity: 0; } to { opacity: 1; transform: none; }
}
.entry {
  animation: entry 0.8s ease-out both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .entry { animation: none; }
}
</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="227.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="227.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">How to Use</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Follow the steps below in order. In the end you will have a block in your profile.</text><circle cx="27.1" cy="110.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="116.7" font-size="17" fill="#B26BFF" font-weight="700">Where the files live</text><text x="24.0" y="151.1" font-size="16" fill="#F2F2FF">The blocks are generated <tspan fill="#00F0FF" font-weight="700">once, on your computer</tspan>, and the .svg files are committed to your <tspan fill="#00F0FF" font-weight="700">profile</tspan></text><text x="24.0" y="175.1" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">repository</tspan>, the special repository named exactly like your GitHub username (for example, Bob/Bob). You</text><text x="24.0" y="199.1" font-size="16" fill="#F2F2FF">do not need a GitHub Action or a token.</text></g></g></svg>