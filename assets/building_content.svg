</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="728.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="728.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Adding Content</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Call each method <tspan fill="#00F0FF" font-weight="700">any number of times and in any order</tspan>. Every method returns the block, so they can</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">be chained.</text><clipPath id="table-clip-24-122"><rect x="24.0" y="122.0" width="752.0" height="317.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-122)"><rect x="24.0" y="122.0" width="752.0" height="317.0" fill="#0C0D1B"/><rect x="24.0" y="122.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="196.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="291.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="365.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="159.0" x2="776.0" y2="159.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="196.0" x2="776.0" y2="196.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="233.0" x2="776.0" y2="233.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="291.0" x2="776.0" y2="291.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="328.0" x2="776.0" y2="328.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="365.0" x2="776.0" y2="365.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="402.0" x2="776.0" y2="402.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">Method</text><text x="282.7" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">What it adds</text><text x="692.4" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700" text-anchor="middle">Default</text><text x="32.0" y="182.4" font-size="14" fill="#F2F2FF">.title(text, font_size)</text><text x="282.7" y="182.4" font-size="14" fill="#F2F2FF">A bold title with the side bar.</text><text x="692.4" y="182.4" font-size="14" fill="#F2F2FF" text-anchor="middle">20</text><text x="32.0" y="219.4" font-size="14" fill="#F2F2FF">.subsection(text, font_size)</text><text x="282.7" y="219.4" font-size="14" fill="#F2F2FF">A bold subsection title with a dot.</text><text x="692.4" y="219.4" font-size="14" fill="#F2F2FF" text-anchor="middle">17</text><text x="32.0" y="256.4" font-size="14" fill="#F2F2FF">.text(text, font_size)</text><text x="282.7" y="256.4" font-size="14" fill="#F2F2FF">A paragraph that breaks lines by itself and accepts</text><text x="282.7" y="277.4" font-size="14" fill="#F2F2FF">markers.</text><text x="692.4" y="256.4" font-size="14" fill="#F2F2FF" text-anchor="middle">16</text><text x="32.0" y="314.4" font-size="14" fill="#F2F2FF">.image(path, width)</text><text x="282.7" y="314.4" font-size="14" fill="#F2F2FF">An image embedded in the SVG.</text><text x="692.4" y="314.4" font-size="14" fill="#F2F2FF" text-anchor="middle">natural width</text><text x="32.0" y="351.4" font-size="14" fill="#F2F2FF">.table(columns, rows, ...)</text><text x="282.7" y="351.4" font-size="14" fill="#F2F2FF">A themed table.</text><text x="692.4" y="351.4" font-size="14" fill="#F2F2FF" text-anchor="middle">see Tables</text><text x="32.0" y="388.4" font-size="14" fill="#F2F2FF">.columns(*columns)</text><text x="282.7" y="388.4" font-size="14" fill="#F2F2FF">Columns of components side by side.</text><text x="692.4" y="388.4" font-size="14" fill="#F2F2FF" text-anchor="middle">see Columns</text><text x="32.0" y="425.4" font-size="14" fill="#F2F2FF">.divider(coverage)</text><text x="282.7" y="425.4" font-size="14" fill="#F2F2FF">A thin line that separates parts of the block.</text><text x="692.4" y="425.4" font-size="14" fill="#F2F2FF" text-anchor="middle">1</text><rect x="24.5" y="122.5" width="751.0" height="316.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="461.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="467.7" font-size="17" fill="#B26BFF" font-weight="700">About dividers</text><text x="24.0" y="502.1" font-size="16" fill="#F2F2FF">The coverage is the share of the width the line occupies, from 0 to 1. The line below uses the default,</text><text x="24.0" y="526.1" font-size="16" fill="#F2F2FF">100%:</text><rect x="24.0" y="542.5" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="572.1" font-size="16" fill="#F2F2FF">And this one uses a coverage of 0.6, so it is shorter and centered:</text><rect x="174.4" y="588.5" width="451.2" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="618.1" font-size="16" fill="#F2F2FF">A coverage of 0 draws nothing, which makes it a handy way to add a larger gap between two pieces of</text><text x="24.0" y="642.1" font-size="16" fill="#F2F2FF">text, as in the space right below.</text><rect x="400.0" y="658.5" width="0.0" height="2" rx="1" fill="#7000FF"/><rect x="400.0" y="670.5" width="0.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="700.1" font-size="16" fill="#F2F2FF">Back to normal spacing.</text></g></g></g></svg>