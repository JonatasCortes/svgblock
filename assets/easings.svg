<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1356.5" viewBox="0 0 800 1356.5"><style>
@keyframes fadein-ac8a6a58 {
0% { opacity: 0; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); } 100% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
.fadein-ac8a6a58 {
  animation: fadein-ac8a6a58 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fadein-ac8a6a58 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1354.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1354.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Easings</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">An easing sets how the speed changes while an animation runs: it can start slow, end slow, go past the</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">final position and come back, bounce, or move in jumps. Pass one to the <tspan fill="#00F0FF" font-weight="700">easing</tspan> parameter of an</text><text x="24.0" y="129.6" font-size="16" fill="#F2F2FF">animation, as in <tspan fill="#00F0FF" font-weight="700">RiseIn(easing=EaseInOut())</tspan>.</text><circle cx="27.1" cy="158.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="164.7" font-size="17" fill="#B26BFF" font-weight="700">Basic</text><clipPath id="table-clip-24-182"><rect x="24.0" y="181.5" width="752.0" height="259.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-182)"><rect x="24.0" y="181.5" width="752.0" height="259.0" fill="#0C0D1B"/><rect x="24.0" y="181.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="255.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="329.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="403.5" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="218.5" x2="776.0" y2="218.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="255.5" x2="776.0" y2="255.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="292.5" x2="776.0" y2="292.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="329.5" x2="776.0" y2="329.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="366.5" x2="776.0" y2="366.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="403.5" x2="776.0" y2="403.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="204.9" font-size="14" fill="#FF1F6E" font-weight="700">Easing</text><text x="305.5" y="204.9" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="241.9" font-size="14" fill="#F2F2FF">Linear()</text><text x="305.5" y="241.9" font-size="14" fill="#F2F2FF">Constant speed from start to end.</text><text x="32.0" y="278.9" font-size="14" fill="#F2F2FF">EaseIn()</text><text x="305.5" y="278.9" font-size="14" fill="#F2F2FF">Starts slow and speeds up.</text><text x="32.0" y="315.9" font-size="14" fill="#F2F2FF">EaseOut()</text><text x="305.5" y="315.9" font-size="14" fill="#F2F2FF">Starts fast and slows down until it stops.</text><text x="32.0" y="352.9" font-size="14" fill="#F2F2FF">EaseInOut()</text><text x="305.5" y="352.9" font-size="14" fill="#F2F2FF">Slow at the start and at the end, fast in the middle.</text><text x="32.0" y="389.9" font-size="14" fill="#F2F2FF">CubicBezier(x1, y1, x2, y2)</text><text x="305.5" y="389.9" font-size="14" fill="#F2F2FF">A curve of your own. See below.</text><text x="32.0" y="426.9" font-size="14" fill="#F2F2FF">Steps(count)</text><text x="305.5" y="426.9" font-size="14" fill="#F2F2FF">Jumps between that many equal steps instead of moving smoothly.</text><rect x="24.5" y="182.0" width="751.0" height="258.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="463.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="469.2" font-size="17" fill="#B26BFF" font-weight="700">Families</text><text x="24.0" y="503.6" font-size="16" fill="#F2F2FF">Each family comes in three forms: <tspan fill="#00F0FF" font-weight="700">In</tspan> starts slow, <tspan fill="#00F0FF" font-weight="700">Out</tspan> ends slow and <tspan fill="#00F0FF" font-weight="700">InOut</tspan> does both. The name is the</text><text x="24.0" y="527.6" font-size="16" fill="#F2F2FF">family plus the form, as in <tspan fill="#00F0FF" font-weight="700">EaseOutCubic()</tspan> or <tspan fill="#00F0FF" font-weight="700">EaseInOutBack()</tspan>.</text><clipPath id="table-clip-24-544"><rect x="24.0" y="544.0" width="752.0" height="259.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-544)"><rect x="24.0" y="544.0" width="752.0" height="259.0" fill="#0C0D1B"/><rect x="24.0" y="544.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="618.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="692.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="766.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="581.0" x2="776.0" y2="581.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="618.0" x2="776.0" y2="618.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="655.0" x2="776.0" y2="655.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="692.0" x2="776.0" y2="692.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="729.0" x2="776.0" y2="729.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="766.0" x2="776.0" y2="766.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="567.4" font-size="14" fill="#FF1F6E" font-weight="700">Family</text><text x="182.4" y="567.4" font-size="14" fill="#FF1F6E" font-weight="700">Character</text><text x="32.0" y="604.4" font-size="14" fill="#F2F2FF">Sine</text><text x="182.4" y="604.4" font-size="14" fill="#F2F2FF">The gentlest curve. Subtle and natural.</text><text x="32.0" y="641.4" font-size="14" fill="#F2F2FF">Cubic</text><text x="182.4" y="641.4" font-size="14" fill="#F2F2FF">A moderate curve that suits most movements.</text><text x="32.0" y="678.4" font-size="14" fill="#F2F2FF">Quint</text><text x="182.4" y="678.4" font-size="14" fill="#F2F2FF">A strong curve: the Out form starts very fast and settles slowly.</text><text x="32.0" y="715.4" font-size="14" fill="#F2F2FF">Expo</text><text x="182.4" y="715.4" font-size="14" fill="#F2F2FF">The strongest: nearly all the movement happens in a short part of the run.</text><text x="32.0" y="752.4" font-size="14" fill="#F2F2FF">Circ</text><text x="182.4" y="752.4" font-size="14" fill="#F2F2FF">Follows a circular arc, so it speeds up or stops more abruptly than Cubic.</text><text x="32.0" y="789.4" font-size="14" fill="#F2F2FF">Back</text><text x="182.4" y="789.4" font-size="14" fill="#F2F2FF">Goes past the limit and comes back. <tspan fill="#00F0FF" font-weight="700">In</tspan> pulls back before moving, <tspan fill="#00F0FF" font-weight="700">Out</tspan> overshoots the end.</text><rect x="24.5" y="544.5" width="751.0" height="258.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="825.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="831.7" font-size="17" fill="#B26BFF" font-weight="700">Physical</text><clipPath id="table-clip-24-848"><rect x="24.0" y="848.5" width="752.0" height="111.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-848)"><rect x="24.0" y="848.5" width="752.0" height="111.0" fill="#0C0D1B"/><rect x="24.0" y="848.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="922.5" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="885.5" x2="776.0" y2="885.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="922.5" x2="776.0" y2="922.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="871.9" font-size="14" fill="#FF1F6E" font-weight="700">Easing</text><text x="305.5" y="871.9" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="908.9" font-size="14" fill="#F2F2FF">Spring()</text><text x="305.5" y="908.9" font-size="14" fill="#F2F2FF">Overshoots the end and oscillates around it until it settles, like a spring.</text><text x="32.0" y="945.9" font-size="14" fill="#F2F2FF">Bounce()</text><text x="305.5" y="945.9" font-size="14" fill="#F2F2FF">Reaches the end and bounces back from it, like a dropped ball.</text><rect x="24.5" y="849.0" width="751.0" height="110.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="982.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="988.2" font-size="17" fill="#B26BFF" font-weight="700">Custom curves</text><text x="24.0" y="1022.6" font-size="16" fill="#F2F2FF">Picture a graph where the horizontal axis is time (0 is the start, 1 is the end) and the vertical axis is</text><text x="24.0" y="1046.6" font-size="16" fill="#F2F2FF">progress (0 is where the animation starts, 1 is where it ends). The curve goes from the bottom left to the</text><text x="24.0" y="1070.6" font-size="16" fill="#F2F2FF">top right and is bent by two control points: <tspan fill="#00F0FF" font-weight="700">(x1, y1)</tspan> pulls the beginning of the curve and <tspan fill="#00F0FF" font-weight="700">(x2, y2)</tspan> pulls its</text><text x="24.0" y="1094.6" font-size="16" fill="#F2F2FF">end.</text><text x="24.0" y="1128.6" font-size="16" fill="#F2F2FF">The x values stay between 0 and 1, while y1 and y2 can be any number: a value below 0 or above 1</text><text x="24.0" y="1152.6" font-size="16" fill="#F2F2FF">makes the animation go past its limits and come back.</text><circle cx="27.1" cy="1181.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="1187.7" font-size="17" fill="#B26BFF" font-weight="700">Good to know</text><text x="24.0" y="1222.1" font-size="16" fill="#F2F2FF">• Easings that go past their limits, such as the Back family and Spring, cannot be used where the blur</text><text x="24.0" y="1246.1" font-size="16" fill="#F2F2FF">would go below 0: <tspan fill="#00F0FF" font-weight="700">FocusIn</tspan>, <tspan fill="#00F0FF" font-weight="700">FocusOut</tspan> and animations with focus=True raise a ValueError.</text><text x="24.0" y="1280.1" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">Spring</tspan> and <tspan fill="#00F0FF" font-weight="700">Bounce</tspan> need a recent browser.</text><rect x="24.0" y="1296.5" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="1326.1" font-size="16" fill="#F2F2FF">Each pair below runs the same animation without easing (left) and with it (right).</text></g></g></g></svg>