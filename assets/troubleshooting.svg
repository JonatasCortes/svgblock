<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100"><style>
@keyframes entry {
  from { opacity: 0; } to { opacity: 1; transform: none; }
}
.entry {
  animation: entry 0.8s ease-out both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .entry { animation: none; }
}
</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1098" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1098" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Troubleshooting</text><clipPath id="table-clip-24-64"><rect x="24.0" y="64.0" width="752.0" height="1012.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-64)"><rect x="24.0" y="64.0" width="752.0" height="1012.0" fill="#0C0D1B"/><rect x="24.0" y="64.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="159.0" width="752.0" height="79.0" fill="#101125"/><rect x="24.0" y="296.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="412.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="528.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="665.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="781.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="918.0" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="101.0" x2="776.0" y2="101.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="159.0" x2="776.0" y2="159.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="238.0" x2="776.0" y2="238.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="296.0" x2="776.0" y2="296.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="354.0" x2="776.0" y2="354.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="412.0" x2="776.0" y2="412.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="470.0" x2="776.0" y2="470.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="528.0" x2="776.0" y2="528.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="586.0" x2="776.0" y2="586.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="665.0" x2="776.0" y2="665.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="723.0" x2="776.0" y2="723.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="781.0" x2="776.0" y2="781.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="839.0" x2="776.0" y2="839.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="918.0" x2="776.0" y2="918.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="976.0" x2="776.0" y2="976.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="87.4" font-size="14" fill="#FF1F6E" font-weight="700">Problem</text><text x="246.9" y="87.4" font-size="14" fill="#FF1F6E" font-weight="700">What to check</text><text x="32.0" y="124.4" font-size="14" fill="#F2F2FF">ValueError: Unknown theme</text><text x="246.9" y="124.4" font-size="14" fill="#F2F2FF">The theme name does not exist. The error message lists every available theme.</text><text x="246.9" y="145.4" font-size="14" fill="#F2F2FF">Names are lowercase, exactly as shown in the Themes section.</text><text x="32.0" y="182.4" font-size="14" fill="#F2F2FF">ValueError: Unknown animation</text><text x="246.9" y="182.4" font-size="14" fill="#F2F2FF">The animation name is wrong. The six valid names are fade, slide-up, slide-down,</text><text x="246.9" y="203.4" font-size="14" fill="#F2F2FF">slide-left, slide-right and pop. To have no animation, omit the parameter or pass</text><text x="246.9" y="224.4" font-size="14" fill="#F2F2FF">None.</text><text x="32.0" y="261.4" font-size="14" fill="#F2F2FF">ValueError about</text><text x="32.0" y="282.4" font-size="14" fill="#F2F2FF">animation_loop</text><text x="246.9" y="261.4" font-size="14" fill="#F2F2FF">animation_loop must be greater than 0.8 seconds, the duration of the entrance, and</text><text x="246.9" y="282.4" font-size="14" fill="#F2F2FF">it needs an animation. Pass animation=... together with it.</text><text x="32.0" y="319.4" font-size="14" fill="#F2F2FF">ValueError: Unclosed marker</text><text x="246.9" y="319.4" font-size="14" fill="#F2F2FF">A marker (**, __, --, ##) was opened and never closed. Every marker needs a</text><text x="246.9" y="340.4" font-size="14" fill="#F2F2FF">closing twin. To write a literal one, put a backslash before each of its characters.</text><text x="32.0" y="377.4" font-size="14" fill="#F2F2FF">A style appears or vanishes</text><text x="32.0" y="398.4" font-size="14" fill="#F2F2FF">where it should not</text><text x="246.9" y="377.4" font-size="14" fill="#F2F2FF">Text that contains **, __, -- or ## toggles a style, even a double hyphen used as a</text><text x="246.9" y="398.4" font-size="14" fill="#F2F2FF">dash or a name like __init__. Escape those characters with a backslash.</text><text x="32.0" y="435.4" font-size="14" fill="#F2F2FF">Markers show up literally in a</text><text x="32.0" y="456.4" font-size="14" fill="#F2F2FF">title or a table header</text><text x="246.9" y="435.4" font-size="14" fill="#F2F2FF">Only paragraphs and table cells read markers. Titles, subsections and table</text><text x="246.9" y="456.4" font-size="14" fill="#F2F2FF">headers are drawn as plain bold text.</text><text x="32.0" y="493.4" font-size="14" fill="#F2F2FF">SyntaxWarning: invalid escape</text><text x="32.0" y="514.4" font-size="14" fill="#F2F2FF">sequence</text><text x="246.9" y="493.4" font-size="14" fill="#F2F2FF">Python is warning about the backslash. Use a raw string (an r before the opening</text><text x="246.9" y="514.4" font-size="14" fill="#F2F2FF">quote) or write the backslash twice.</text><text x="32.0" y="551.4" font-size="14" fill="#F2F2FF">Errors about the | symbol in</text><text x="32.0" y="572.4" font-size="14" fill="#F2F2FF">type hints</text><text x="246.9" y="551.4" font-size="14" fill="#F2F2FF">You are using a Python older than 3.10. Update Python and install again.</text><text x="32.0" y="609.4" font-size="14" fill="#F2F2FF">ValueError from table, columns,</text><text x="32.0" y="630.4" font-size="14" fill="#F2F2FF">divider or image</text><text x="246.9" y="609.4" font-size="14" fill="#F2F2FF">Every table row needs as many cells as columns, align and weights need one value</text><text x="246.9" y="630.4" font-size="14" fill="#F2F2FF">per column, a divider coverage must be between 0 and 1 and an image width must</text><text x="246.9" y="651.4" font-size="14" fill="#F2F2FF">be greater than zero.</text><text x="32.0" y="688.4" font-size="14" fill="#F2F2FF">The image is missing or fails to</text><text x="32.0" y="709.4" font-size="14" fill="#F2F2FF">load</text><text x="246.9" y="688.4" font-size="14" fill="#F2F2FF">The path is read when you run the script, relative to the folder you run it from.</text><text x="246.9" y="709.4" font-size="14" fill="#F2F2FF">Check that the file exists there.</text><text x="32.0" y="746.4" font-size="14" fill="#F2F2FF">A title, a subsection or a very</text><text x="32.0" y="767.4" font-size="14" fill="#F2F2FF">long word goes past the border</text><text x="246.9" y="746.4" font-size="14" fill="#F2F2FF">Titles and subsections stay on a single line, and a word bigger than its space</text><text x="246.9" y="767.4" font-size="14" fill="#F2F2FF">cannot fit. Shorten the text, reduce the font_size or increase the width.</text><text x="32.0" y="804.4" font-size="14" fill="#F2F2FF">Words are broken in the middle</text><text x="32.0" y="825.4" font-size="14" fill="#F2F2FF">inside a table or a column</text><text x="246.9" y="804.4" font-size="14" fill="#F2F2FF">A narrow column cannot fit a long word, so it is broken. Give that column a larger</text><text x="246.9" y="825.4" font-size="14" fill="#F2F2FF">weight, shorten the text or increase the width of the block.</text><text x="32.0" y="862.4" font-size="14" fill="#F2F2FF">Lines break earlier or later than</text><text x="32.0" y="883.4" font-size="14" fill="#F2F2FF">expected</text><text x="246.9" y="862.4" font-size="14" fill="#F2F2FF">The width of the text is estimated with the Arial font. On a system without Arial the</text><text x="246.9" y="883.4" font-size="14" fill="#F2F2FF">browser uses another font, so lines can look slightly different. Emojis and curly</text><text x="246.9" y="904.4" font-size="14" fill="#F2F2FF">quotes are measured as a full letter wide.</text><text x="32.0" y="941.4" font-size="14" fill="#F2F2FF">The block does not appear in</text><text x="32.0" y="962.4" font-size="14" fill="#F2F2FF">my profile</text><text x="246.9" y="941.4" font-size="14" fill="#F2F2FF">Check that the .svg file was committed and pushed, and that the path in the img tag</text><text x="246.9" y="962.4" font-size="14" fill="#F2F2FF">matches the file name exactly (GitHub paths are case sensitive).</text><text x="32.0" y="999.4" font-size="14" fill="#F2F2FF">The animation does not play</text><text x="246.9" y="999.4" font-size="14" fill="#F2F2FF">Blocks are static unless you pass animation. Without animation_loop the animation</text><text x="246.9" y="1020.4" font-size="14" fill="#F2F2FF">plays once, when the image loads, so reload the page to see it again. It is disabled</text><text x="246.9" y="1041.4" font-size="14" fill="#F2F2FF">for people who turned on reduce motion, and some image viewers and editors do</text><text x="246.9" y="1062.4" font-size="14" fill="#F2F2FF">not run animations. Open the file in a browser to check.</text><rect x="24.5" y="64.5" width="751.0" height="1011.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/></g></g></svg>