</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="415" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="415" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Editing a Theme</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Every ready-made theme is a member of the <tspan fill="#00F0FF" font-weight="700">Theme</tspan> enum, and its colors are in <tspan fill="#00F0FF" font-weight="700">.value</tspan>, which is a</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">ThemeData. Change some of them with <tspan fill="#00F0FF" font-weight="700">.update(...)</tspan>, passing only the colors you want to replace. The</text><text x="24.0" y="129.6" font-size="16" fill="#F2F2FF">library files stay untouched.</text><circle cx="27.1" cy="158.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="164.7" font-size="17" fill="#B26BFF" font-weight="700">The change applies to the whole program</text><text x="24.0" y="199.1" font-size="16" fill="#F2F2FF">Ready-made themes are shared. After Theme.RED.value.update(...), every block that uses Theme.RED</text><text x="24.0" y="223.1" font-size="16" fill="#F2F2FF">gets the new colors, until the program ends. Make the change <tspan fill="#00F0FF" font-weight="700">before</tspan> you build the blocks that use it.</text><circle cx="27.1" cy="252.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="258.2" font-size="17" fill="#B26BFF" font-weight="700">Keeping the original</text><text x="24.0" y="292.6" font-size="16" fill="#F2F2FF">To get a variation and still use the original somewhere else, make a copy with <tspan fill="#00F0FF" font-weight="700">.value.copy()</tspan>, change the</text><text x="24.0" y="316.6" font-size="16" fill="#F2F2FF">copy and pass it to Block. The ready-made theme is not affected.</text><rect x="24.0" y="333.0" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="362.6" font-size="16" fill="#F2F2FF">A copy is also the quickest way to create a theme: start from one that is close to what you want and</text><text x="24.0" y="386.6" font-size="16" fill="#F2F2FF">change only the colors that differ.</text></g></g></g></svg>