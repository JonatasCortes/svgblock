<svg xmlns="http://www.w3.org/2000/svg" width="800" height="995" viewBox="0 0 800 995"><style>
@keyframes fade-f16f3800 {
0% { opacity: 0; transform: translate(0px, 0px) scale(1); } 100% { opacity: 1; transform: translate(0px, 0px) scale(1); }
}
.fade-f16f3800 {
  animation: fade-f16f3800 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fade-f16f3800 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="993" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="993" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Parameters</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Every parameter is optional and passed by name, as in <tspan fill="#00F0FF" font-weight="700">Rise(distance=60)</tspan>. The only values passed by</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">position are the duration of <tspan fill="#00F0FF" font-weight="700">Show</tspan> and <tspan fill="#00F0FF" font-weight="700">Hide</tspan>, which is required, and the animations of a <tspan fill="#00F0FF" font-weight="700">Sequence</tspan>.</text><circle cx="27.1" cy="134.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="140.7" font-size="17" fill="#B26BFF" font-weight="700">Defaults</text><clipPath id="table-clip-24-158"><rect x="24.0" y="157.5" width="752.0" height="333.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-158)"><rect x="24.0" y="157.5" width="752.0" height="333.0" fill="#0C0D1B"/><rect x="24.0" y="157.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="231.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="305.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="379.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="453.5" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="194.5" x2="776.0" y2="194.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="231.5" x2="776.0" y2="231.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="268.5" x2="776.0" y2="268.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="305.5" x2="776.0" y2="305.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="342.5" x2="776.0" y2="342.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="379.5" x2="776.0" y2="379.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="416.5" x2="776.0" y2="416.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="453.5" x2="776.0" y2="453.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">Animation</text><text x="182.4" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">Parameters and default values</text><text x="32.0" y="217.9" font-size="14" fill="#F2F2FF">Fade</text><text x="182.4" y="217.9" font-size="14" fill="#F2F2FF">duration=0.8, easing=EaseOut()</text><text x="32.0" y="254.9" font-size="14" fill="#F2F2FF">Rise</text><text x="182.4" y="254.9" font-size="14" fill="#F2F2FF">distance=40, fade=True, duration=0.8, easing=EaseOutQuint()</text><text x="32.0" y="291.9" font-size="14" fill="#F2F2FF">Drop</text><text x="182.4" y="291.9" font-size="14" fill="#F2F2FF">distance=40, fade=True, duration=0.8, easing=EaseOutQuint()</text><text x="32.0" y="328.9" font-size="14" fill="#F2F2FF">Pop</text><text x="182.4" y="328.9" font-size="14" fill="#F2F2FF">start_scale=0.8, fade=True, duration=0.6, easing=EaseOutBack()</text><text x="32.0" y="365.9" font-size="14" fill="#F2F2FF">Pulse</text><text x="182.4" y="365.9" font-size="14" fill="#F2F2FF">amount=0.06, duration=2, easing=EaseInOut(), loop_limit=0</text><text x="32.0" y="402.9" font-size="14" fill="#F2F2FF">Show</text><text x="182.4" y="402.9" font-size="14" fill="#F2F2FF">duration (required)</text><text x="32.0" y="439.9" font-size="14" fill="#F2F2FF">Hide</text><text x="182.4" y="439.9" font-size="14" fill="#F2F2FF">duration (required)</text><text x="32.0" y="476.9" font-size="14" fill="#F2F2FF">Sequence</text><text x="182.4" y="476.9" font-size="14" fill="#F2F2FF">the animations, in order, and loop_limit=0</text><rect x="24.5" y="158.0" width="751.0" height="332.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><circle cx="27.1" cy="513.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="519.2" font-size="17" fill="#B26BFF" font-weight="700">What each parameter does</text><clipPath id="table-clip-24-536"><rect x="24.0" y="536.0" width="752.0" height="401.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-536)"><rect x="24.0" y="536.0" width="752.0" height="401.0" fill="#0C0D1B"/><rect x="24.0" y="536.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="631.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="726.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="842.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="573.0" x2="776.0" y2="573.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="631.0" x2="776.0" y2="631.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="668.0" x2="776.0" y2="668.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="726.0" x2="776.0" y2="726.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="784.0" x2="776.0" y2="784.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="842.0" x2="776.0" y2="842.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="879.0" x2="776.0" y2="879.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="559.4" font-size="14" fill="#FF1F6E" font-weight="700">Parameter</text><text x="168.7" y="559.4" font-size="14" fill="#FF1F6E" font-weight="700">Accepts</text><text x="373.8" y="559.4" font-size="14" fill="#FF1F6E" font-weight="700">What it does</text><text x="32.0" y="596.4" font-size="14" fill="#F2F2FF">duration</text><text x="168.7" y="596.4" font-size="14" fill="#F2F2FF">A number greater than 0</text><text x="373.8" y="596.4" font-size="14" fill="#F2F2FF">How many seconds one run takes. In <tspan fill="#00F0FF" font-weight="700">Show</tspan> and <tspan fill="#00F0FF" font-weight="700">Hide</tspan>, how</text><text x="373.8" y="617.4" font-size="14" fill="#F2F2FF">long they last.</text><text x="32.0" y="654.4" font-size="14" fill="#F2F2FF">easing</text><text x="168.7" y="654.4" font-size="14" fill="#F2F2FF">An easing, such as EaseOut()</text><text x="373.8" y="654.4" font-size="14" fill="#F2F2FF">How the speed changes during the run. See Easings.</text><text x="32.0" y="691.4" font-size="14" fill="#F2F2FF">distance</text><text x="168.7" y="691.4" font-size="14" fill="#F2F2FF">A number, 0 or more</text><text x="373.8" y="691.4" font-size="14" fill="#F2F2FF">How many pixels the block travels in <tspan fill="#00F0FF" font-weight="700">Rise</tspan> and <tspan fill="#00F0FF" font-weight="700">Drop</tspan>. With 0 the</text><text x="373.8" y="712.4" font-size="14" fill="#F2F2FF">block does not move.</text><text x="32.0" y="749.4" font-size="14" fill="#F2F2FF">fade</text><text x="168.7" y="749.4" font-size="14" fill="#F2F2FF">True or False</text><text x="373.8" y="749.4" font-size="14" fill="#F2F2FF">Whether <tspan fill="#00F0FF" font-weight="700">Rise</tspan>, <tspan fill="#00F0FF" font-weight="700">Drop</tspan> and <tspan fill="#00F0FF" font-weight="700">Pop</tspan> also fade in. With False the block</text><text x="373.8" y="770.4" font-size="14" fill="#F2F2FF">is fully visible while it moves.</text><text x="32.0" y="807.4" font-size="14" fill="#F2F2FF">start_scale</text><text x="168.7" y="807.4" font-size="14" fill="#F2F2FF">A number greater than 0</text><text x="373.8" y="807.4" font-size="14" fill="#F2F2FF">The starting size in <tspan fill="#00F0FF" font-weight="700">Pop</tspan>, where 1 is the normal size: 0.8 starts</text><text x="373.8" y="828.4" font-size="14" fill="#F2F2FF">at 80%.</text><text x="32.0" y="865.4" font-size="14" fill="#F2F2FF">amount</text><text x="168.7" y="865.4" font-size="14" fill="#F2F2FF">A number greater than 0</text><text x="373.8" y="865.4" font-size="14" fill="#F2F2FF">How much <tspan fill="#00F0FF" font-weight="700">Pulse</tspan> grows at its peak: 0.06 means 6% bigger.</text><text x="32.0" y="902.4" font-size="14" fill="#F2F2FF">loop_limit</text><text x="168.7" y="902.4" font-size="14" fill="#F2F2FF">A whole number from 0 to</text><text x="168.7" y="923.4" font-size="14" fill="#F2F2FF">1000, or None</text><text x="373.8" y="902.4" font-size="14" fill="#F2F2FF">How many times the animation runs again after its first run, in</text><text x="373.8" y="923.4" font-size="14" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">Pulse</tspan> and <tspan fill="#00F0FF" font-weight="700">Sequence</tspan>. None means no limit. See Repeating.</text><rect x="24.5" y="536.5" width="751.0" height="400.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="964.6" font-size="16" fill="#F2F2FF">Customized animations are shown below. Each box shows the code that produced it.</text></g></g></g></svg>