<svg xmlns="http://www.w3.org/2000/svg" width="800" height="593.5" viewBox="0 0 800 593.5"><style>
@keyframes entry {
  from { opacity: 0; } to { opacity: 1; transform: none; }
}
.entry {
  animation: entry 0.8s ease-out both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .entry { animation: none; }
}
</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="591.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="591.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Customization</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">svgblock was made to be simple, so it has <tspan fill="#00F0FF" font-weight="700">a few things you can choose</tspan> and a clear place to change</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">everything else.</text><circle cx="27.1" cy="134.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="140.7" font-size="17" fill="#B26BFF" font-weight="700">What you can change</text><clipPath id="table-clip-24-158"><rect x="24.0" y="157.5" width="752.0" height="354.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-158)"><rect x="24.0" y="157.5" width="752.0" height="354.0" fill="#0C0D1B"/><rect x="24.0" y="157.5" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="231.5" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="326.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="400.5" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="474.5" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="194.5" x2="776.0" y2="194.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="231.5" x2="776.0" y2="231.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="289.5" x2="776.0" y2="289.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="326.5" x2="776.0" y2="326.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="363.5" x2="776.0" y2="363.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="400.5" x2="776.0" y2="400.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="437.5" x2="776.0" y2="437.5" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="474.5" x2="776.0" y2="474.5" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">What</text><text x="257.6" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">How</text><text x="483.2" y="180.9" font-size="14" fill="#FF1F6E" font-weight="700">Where</text><text x="32.0" y="217.9" font-size="14" fill="#F2F2FF">Colors and visual style</text><text x="257.6" y="217.9" font-size="14" fill="#F2F2FF">Pick a ready-made theme</text><text x="483.2" y="217.9" font-size="14" fill="#F2F2FF">theme= in Block(...)</text><text x="32.0" y="254.9" font-size="14" fill="#F2F2FF">Entrance animation</text><text x="257.6" y="254.9" font-size="14" fill="#F2F2FF">Pick one of the six options, or</text><text x="257.6" y="275.9" font-size="14" fill="#F2F2FF">none</text><text x="483.2" y="254.9" font-size="14" fill="#F2F2FF">animation= in Block(...)</text><text x="32.0" y="312.9" font-size="14" fill="#F2F2FF">Animation replay</text><text x="257.6" y="312.9" font-size="14" fill="#F2F2FF">Set the seconds between replays</text><text x="483.2" y="312.9" font-size="14" fill="#F2F2FF">animation_loop= in Block(...)</text><text x="32.0" y="349.9" font-size="14" fill="#F2F2FF">Width of the block</text><text x="257.6" y="349.9" font-size="14" fill="#F2F2FF">Set a number of pixels</text><text x="483.2" y="349.9" font-size="14" fill="#F2F2FF">width= in Block(...)</text><text x="32.0" y="386.9" font-size="14" fill="#F2F2FF">Size of the text</text><text x="257.6" y="386.9" font-size="14" fill="#F2F2FF">Set a number of pixels</text><text x="483.2" y="386.9" font-size="14" fill="#F2F2FF">font_size= in .title(), .subsection() and .text()</text><text x="32.0" y="423.9" font-size="14" fill="#F2F2FF">Look of a table</text><text x="257.6" y="423.9" font-size="14" fill="#F2F2FF">Pass options to the table</text><text x="483.2" y="423.9" font-size="14" fill="#F2F2FF">See Tables</text><text x="32.0" y="460.9" font-size="14" fill="#F2F2FF">A new theme</text><text x="257.6" y="460.9" font-size="14" fill="#F2F2FF">Add an entry to THEMES</text><text x="483.2" y="460.9" font-size="14" fill="#F2F2FF">svgblock/themes.py</text><text x="32.0" y="497.9" font-size="14" fill="#F2F2FF">Anything else</text><text x="257.6" y="497.9" font-size="14" fill="#F2F2FF">Edit the constants</text><text x="483.2" y="497.9" font-size="14" fill="#F2F2FF">See Constants Reference</text><rect x="24.5" y="158.0" width="751.0" height="353.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="539.1" font-size="16" fill="#F2F2FF">The font family is not customizable on purpose: the library measures text using the widths of the Arial font</text><text x="24.0" y="563.1" font-size="16" fill="#F2F2FF">to break lines correctly, so it always asks for Arial first, then Helvetica, then the default sans-serif font.</text></g></g></svg>