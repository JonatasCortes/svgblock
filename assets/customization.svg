2FF">several</text><text x="442.2" y="312.9" font-size="14" fill="#F2F2FF">animation= in Block(...). See Animations</text><text x="32.0" y="370.9" font-size="14" fill="#F2F2FF">How an animation accelerates</text><text x="237.1" y="370.9" font-size="14" fill="#F2F2FF">Pick an easing curve</text><text x="442.2" y="370.9" font-size="14" fill="#F2F2FF">easing= in the animations. See Easings</text><text x="32.0" y="407.9" font-size="14" fill="#F2F2FF">Width of the block</text><text x="237.1" y="407.9" font-size="14" fill="#F2F2FF">Set a number of pixels</text><text x="442.2" y="407.9" font-size="14" fill="#F2F2FF">width= in Block(...)</text><text x="32.0" y="444.9" font-size="14" fill="#F2F2FF">Space around the content</text><text x="237.1" y="444.9" font-size="14" fill="#F2F2FF">Set a number of pixels</text><text x="442.2" y="444.9" font-size="14" fill="#F2F2FF">padding= in Block(...)</text><text x="32.0" y="481.9" font-size="14" fill="#F2F2FF">Border and background</text><text x="237.1" y="481.9" font-size="14" fill="#F2F2FF">Hide them</text><text x="442.2" y="481.9" font-size="14" fill="#F2F2FF">hide_frame=True in Block(...)</text><text x="32.0" y="518.9" font-size="14" fill="#F2F2FF">Size of the text</text><text x="237.1" y="518.9" font-size="14" fill="#F2F2FF">Set a number of pixels</text><text x="442.2" y="518.9" font-size="14" fill="#F2F2FF">font_size= in .title(), .subsection() and .text()</text><text x="32.0" y="555.9" font-size="14" fill="#F2F2FF">Look of a table</text><text x="237.1" y="555.9" font-size="14" fill="#F2F2FF">Pass options to the table</text><text x="442.2" y="555.9" font-size="14" fill="#F2F2FF">See Tables</text><text x="32.0" y="592.9" font-size="14" fill="#F2F2FF">Spacing and sizes</text><text x="237.1" y="592.9" font-size="14" fill="#F2F2FF">Edit the constants</text><text x="442.2" y="592.9" font-size="14" fill="#F2F2FF">See Constants Reference</text><rect x="24.5" y="100.0" width="751.0" height="506.0" rx="8" fill="none" stroke="#4B2A9A" stro