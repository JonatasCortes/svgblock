<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1038" viewBox="0 0 800 1038"><style>
@keyframes fade-f16f3800 {
0% { opacity: 0; transform: translate(0px, 0px) scale(1); } 100% { opacity: 1; transform: translate(0px, 0px) scale(1); }
}
.fade-f16f3800 {
  animation: fade-f16f3800 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fade-f16f3800 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1036" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1036" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Sequences</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">Sequence(...)</tspan> plays animations one after another: each one starts when the previous one ends. Pass the</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">animations in order and, if you want, <tspan fill="#00F0FF" font-weight="700">loop_limit</tspan> to repeat the whole sequence. A step can be any</text><text x="24.0" y="129.6" font-size="16" fill="#F2F2FF">animation, including another sequence.</text><circle cx="27.1" cy="158.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="164.7" font-size="17" fill="#B26BFF" font-weight="700">Waiting</text><text x="24.0" y="199.1" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">Show(duration)</tspan> keeps the block still for a while, looking exactly as it normally does. <tspan fill="#00F0FF" font-weight="700">Hide(duration)</tspan> hides</text><text x="24.0" y="223.1" font-size="16" fill="#F2F2FF">the block for a while. Use them to delay or to separate steps.</text><circle cx="27.1" cy="252.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="258.2" font-size="17" fill="#B26BFF" font-weight="700">Two levels of repetition</text><clipPath id="table-clip-24-275"><rect x="24.0" y="275.0" width="752.0" height="111.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-275)"><rect x="24.0" y="275.0" width="752.0" height="111.0" fill="#0C0D1B"/><rect x="24.0" y="275.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="349.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="312.0" x2="776.0" y2="312.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="349.0" x2="776.0" y2="349.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="298.4" font-size="14" fill="#FF1F6E" font-weight="700">Where loop_limit is</text><text x="354.3" y="298.4" font-size="14" fill="#FF1F6E" font-weight="700">What it repeats</text><text x="32.0" y="335.4" font-size="14" fill="#F2F2FF">On an animation inside the sequence</text><text x="354.3" y="335.4" font-size="14" fill="#F2F2FF">Only that animation, every time the sequence runs.</text><text x="32.0" y="372.4" font-size="14" fill="#F2F2FF">On the sequence</text><text x="354.3" y="372.4" font-size="14" fill="#F2F2FF">The whole sequence, from its first step.</text><rect x="24.5" y="275.5" width="751.0" height="110.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="413.6" font-size="16" fill="#F2F2FF">For example, a sequence with loop_limit=2 runs three times, and a Pulse with loop_limit=4 inside it pulses</text><text x="24.0" y="437.6" font-size="16" fill="#F2F2FF">five times in each run.</text><circle cx="27.1" cy="466.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="472.7" font-size="17" fill="#B26BFF" font-weight="700">Steps are not blended</text><text x="24.0" y="507.1" font-size="16" fill="#F2F2FF">Each step starts from its own starting state, and svgblock does not smooth the connection between steps.</text><text x="24.0" y="531.1" font-size="16" fill="#F2F2FF">After a Rise the block is in place, so a second entrance right after it makes the block jump back to its</text><text x="24.0" y="555.1" font-size="16" fill="#F2F2FF">starting state and enter again. You choose steps that fit together, and <tspan fill="#00F0FF" font-weight="700">Show</tspan> is the natural way to separate</text><text x="24.0" y="579.1" font-size="16" fill="#F2F2FF">them.</text><circle cx="27.1" cy="608.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="614.2" font-size="17" fill="#B26BFF" font-weight="700">Infinite steps</text><text x="24.0" y="648.6" font-size="16" fill="#F2F2FF">• An animation with loop_limit=None never ends, so only the <tspan fill="#00F0FF" font-weight="700">last</tspan> step of a sequence can be infinite:</text><text x="24.0" y="672.6" font-size="16" fill="#F2F2FF">anything after it would never play.</text><text x="24.0" y="706.6" font-size="16" fill="#F2F2FF">• When the last step is infinite, the sequence never reaches its end, so its own loop_limit has no effect.</text><circle cx="27.1" cy="735.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="741.7" font-size="17" fill="#B26BFF" font-weight="700">Nesting, empty and large sequences</text><text x="24.0" y="776.1" font-size="16" fill="#F2F2FF">• A sequence can be a step of another sequence. Each one keeps its own loop_limit.</text><text x="24.0" y="810.1" font-size="16" fill="#F2F2FF">• A sequence with no steps is valid and does nothing: the block is shown static.</text><text x="24.0" y="844.1" font-size="16" fill="#F2F2FF">• The repetitions are counted one by one, and a sequence cannot have more than 10,000 of them in</text><text x="24.0" y="868.1" font-size="16" fill="#F2F2FF">total. To repeat without a limit, use loop_limit=None instead of a very large number.</text><circle cx="27.1" cy="897.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="903.2" font-size="17" fill="#B26BFF" font-weight="700">When it ends</text><text x="24.0" y="937.6" font-size="16" fill="#F2F2FF">After its last step, a finite sequence leaves the block in the final state of that step. If the last step is <tspan fill="#00F0FF" font-weight="700">Hide</tspan>,</text><text x="24.0" y="961.6" font-size="16" fill="#F2F2FF">the block stays hidden.</text><rect x="24.0" y="978.0" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="1007.6" font-size="16" fill="#F2F2FF">Combined animations are shown below. Each box shows the code that produced it.</text></g></g></g></svg>