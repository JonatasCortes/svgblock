</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="566" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="566" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">How a Block Is Built</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">A block is a stack of <tspan fill="#00F0FF" font-weight="700">components</tspan> inside a frame. You choose what goes inside and in which order, and</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">the theme provides the colors.</text><clipPath id="table-clip-24-122"><rect x="24.0" y="122.0" width="752.0" height="422.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-122)"><rect x="24.0" y="122.0" width="752.0" height="422.0" fill="#0C0D1B"/><rect x="24.0" y="122.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="217.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="333.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="449.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="159.0" x2="776.0" y2="159.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="217.0" x2="776.0" y2="217.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="275.0" x2="776.0" y2="275.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="333.0" x2="776.0" y2="333.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="391.0" x2="776.0" y2="391.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="449.0" x2="776.0" y2="449.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="486.0" x2="776.0" y2="486.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">What you see</text><text x="168.7" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">How to add it</text><text x="373.8" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">What it is</text><text x="32.0" y="182.4" font-size="14" fill="#F2F2FF">Title</text><text x="168.7" y="182.4" font-size="14" fill="#F2F2FF">.title()</text><text x="373.8" y="182.4" font-size="14" fill="#F2F2FF">A bold line with a small rounded bar on its left. It stays on a</text><text x="373.8" y="203.4" font-size="14" fill="#F2F2FF">single line, so keep it short.</text><text x="32.0" y="240.4" font-size="14" fill="#F2F2FF">Subsection</text><text x="168.7" y="240.4" font-size="14" fill="#F2F2FF">.subsection()</text><text x="373.8" y="240.4" font-size="14" fill="#F2F2FF">A smaller bold line with a dot on its left. It also stays on a single</text><text x="373.8" y="261.4" font-size="14" fill="#F2F2FF">line.</text><text x="32.0" y="298.4" font-size="14" fill="#F2F2FF">Text</text><text x="168.7" y="298.4" font-size="14" fill="#F2F2FF">.text()</text><text x="373.8" y="298.4" font-size="14" fill="#F2F2FF">A paragraph that breaks into lines by itself and accepts <tspan fill="#00F0FF" font-weight="700">inline</tspan></text><text x="373.8" y="319.4" font-size="14" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">styles</tspan>.</text><text x="32.0" y="356.4" font-size="14" fill="#F2F2FF">Table</text><text x="168.7" y="356.4" font-size="14" fill="#F2F2FF">.table()</text><text x="373.8" y="356.4" font-size="14" fill="#F2F2FF">A grid with header, optional stripes and dividers. Cells accept</text><text x="373.8" y="377.4" font-size="14" fill="#F2F2FF">inline styles too.</text><text x="32.0" y="414.4" font-size="14" fill="#F2F2FF">Image</text><text x="168.7" y="414.4" font-size="14" fill="#F2F2FF">.image()</text><text x="373.8" y="414.4" font-size="14" fill="#F2F2FF">A picture embedded in the SVG, scaled to fit the available</text><text x="373.8" y="435.4" font-size="14" fill="#F2F2FF">width.</text><text x="32.0" y="472.4" font-size="14" fill="#F2F2FF">Columns</text><text x="168.7" y="472.4" font-size="14" fill="#F2F2FF">.columns()</text><text x="373.8" y="472.4" font-size="14" fill="#F2F2FF">Stacks of components side by side, sized by weight.</text><text x="32.0" y="509.4" font-size="14" fill="#F2F2FF">Divider</text><text x="168.7" y="509.4" font-size="14" fill="#F2F2FF">.divider()</text><text x="373.8" y="509.4" font-size="14" fill="#F2F2FF">A thin line that separates parts of the block. It spans the full</text><text x="373.8" y="530.4" font-size="14" fill="#F2F2FF">width by default.</text><rect x="24.5" y="122.5" width="751.0" height="421.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/></g></g></g></svg>