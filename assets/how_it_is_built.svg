<svg xmlns="http://www.w3.org/2000/svg" width="800" height="849.5" viewBox="0 0 800 849.5"><style>
@keyframes entry {
  from { opacity: 0; } to { opacity: 1; transform: none; }
}
.entry {
  animation: entry 0.8s ease-out both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .entry { animation: none; }
}
</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="847.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="847.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">How a Block Is Built</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">A block is a stack of <tspan fill="#00F0FF" font-weight="700">components</tspan> inside a frame. You choose what goes inside and in which order, and</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">the theme chooses every color.</text><clipPath id="table-clip-24-122"><rect x="24.0" y="122.0" width="752.0" height="428.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-122)"><rect x="24.0" y="122.0" width="752.0" height="428.0" fill="#0C0D1B"/><rect x="24.0" y="122.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="196.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="270.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="344.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="418.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="492.0" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="159.0" x2="776.0" y2="159.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="196.0" x2="776.0" y2="196.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="233.0" x2="776.0" y2="233.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="270.0" x2="776.0" y2="270.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="307.0" x2="776.0" y2="307.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="344.0" x2="776.0" y2="344.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="381.0" x2="776.0" y2="381.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="418.0" x2="776.0" y2="418.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="455.0" x2="776.0" y2="455.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="492.0" x2="776.0" y2="492.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">What you see</text><text x="220.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">What it means</text><text x="32.0" y="182.4" font-size="14" fill="#F2F2FF">Border</text><text x="220.0" y="182.4" font-size="14" fill="#F2F2FF">A diagonal gradient between two theme colors, with rounded corners.</text><text x="32.0" y="219.4" font-size="14" fill="#F2F2FF">Background</text><text x="220.0" y="219.4" font-size="14" fill="#F2F2FF">A radial glow: bright in the center, darker at the edges.</text><text x="32.0" y="256.4" font-size="14" fill="#F2F2FF">Title</text><text x="220.0" y="256.4" font-size="14" fill="#F2F2FF">A bold line with a small rounded bar on its left.</text><text x="32.0" y="293.4" font-size="14" fill="#F2F2FF">Subsection</text><text x="220.0" y="293.4" font-size="14" fill="#F2F2FF">A smaller bold line with a dot on its left.</text><text x="32.0" y="330.4" font-size="14" fill="#F2F2FF">Text</text><text x="220.0" y="330.4" font-size="14" fill="#F2F2FF">A paragraph that breaks into lines by itself and accepts <tspan fill="#00F0FF" font-weight="700">inline styles</tspan>.</text><text x="32.0" y="367.4" font-size="14" fill="#F2F2FF">Table</text><text x="220.0" y="367.4" font-size="14" fill="#F2F2FF">A grid with header, optional stripes and dividers. Cells accept inline styles too.</text><text x="32.0" y="404.4" font-size="14" fill="#F2F2FF">Image</text><text x="220.0" y="404.4" font-size="14" fill="#F2F2FF">A picture embedded in the SVG, scaled to fit the available width.</text><text x="32.0" y="441.4" font-size="14" fill="#F2F2FF">Columns</text><text x="220.0" y="441.4" font-size="14" fill="#F2F2FF">Stacks of components side by side, sized by weight.</text><text x="32.0" y="478.4" font-size="14" fill="#F2F2FF">Divider</text><text x="220.0" y="478.4" font-size="14" fill="#F2F2FF">A thin line that separates parts of the block. It spans the full width by default.</text><text x="32.0" y="515.4" font-size="14" fill="#F2F2FF">Entrance animation</text><text x="220.0" y="515.4" font-size="14" fill="#F2F2FF">Optional. The whole block appears when the page loads, and can repeat on a timer.</text><text x="220.0" y="536.4" font-size="14" fill="#F2F2FF">Chosen by you, never by the theme.</text><rect x="24.5" y="122.5" width="751.0" height="427.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><rect x="24.0" y="560.0" width="752.0" height="2" rx="1" fill="#7000FF"/><circle cx="27.1" cy="584.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="590.7" font-size="17" fill="#B26BFF" font-weight="700">Rules you should know</text><text x="24.0" y="625.1" font-size="16" fill="#F2F2FF">• The <tspan fill="#00F0FF" font-weight="700">height</tspan> of the block is calculated automatically from its content.</text><text x="24.0" y="659.1" font-size="16" fill="#F2F2FF">• Components appear in the order you add them. A block can have no title, or many.</text><text x="24.0" y="693.1" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">Text</tspan> breaks lines automatically, but <tspan fill="#00F0FF" font-weight="700">titles and subsections</tspan> stay on a single line.</text><text x="24.0" y="727.1" font-size="16" fill="#F2F2FF">• Columns hold anything a block holds, even other columns.</text><text x="24.0" y="761.1" font-size="16" fill="#F2F2FF">• The <tspan fill="#00F0FF" font-weight="700">font</tspan> is always Arial, falling back to Helvetica and then to the default sans-serif font. You choose</text><text x="24.0" y="785.1" font-size="16" fill="#F2F2FF">only the size.</text><text x="24.0" y="819.1" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">Colors</tspan> are never set one by one. They always come from a theme.</text></g></g></svg>