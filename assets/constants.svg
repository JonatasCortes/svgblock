</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="882" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="882" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Constants Reference</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Constants at the top of each file of the <tspan fill="#00F0FF" font-weight="700">svgblock/</tspan> folder control the details of the layout. With the</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">repository installed in editable mode, your changes take effect right away.</text><clipPath id="table-clip-24-122"><rect x="24.0" y="122.0" width="752.0" height="574.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-122)"><rect x="24.0" y="122.0" width="752.0" height="574.0" fill="#0C0D1B"/><rect x="24.0" y="122.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="280.0" width="752.0" height="58.0" fill="#101125"/><rect x="24.0" y="459.0" width="752.0" height="121.0" fill="#101125"/><rect x="24.0" y="638.0" width="752.0" height="58.0" fill="#101125"/></g><line x1="24.0" y1="159.0" x2="776.0" y2="159.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="280.0" x2="776.0" y2="280.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="338.0" x2="776.0" y2="338.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="459.0" x2="776.0" y2="459.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="580.0" x2="776.0" y2="580.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="638.0" x2="776.0" y2="638.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">File</text><text x="205.5" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">Constants</text><text x="494.8" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">What it controls</text><text x="32.0" y="182.4" font-size="14" fill="#F2F2FF">composer.py</text><text x="205.5" y="182.4" font-size="14" fill="#F2F2FF">TITLE_FONT_SIZE,</text><text x="205.5" y="203.4" font-size="14" fill="#F2F2FF">SUBSECTION_FONT_SIZE,</text><text x="205.5" y="224.4" font-size="14" fill="#F2F2FF">TEXT_FONT_SIZE, COMPONENT_GAP,</text><text x="205.5" y="245.4" font-size="14" fill="#F2F2FF">COLUMN_GAP,</text><text x="205.5" y="266.4" font-size="14" fill="#F2F2FF">DEFAULT_COLUMN_WEIGHT</text><text x="494.8" y="182.4" font-size="14" fill="#F2F2FF">Default font sizes, the space between</text><text x="494.8" y="203.4" font-size="14" fill="#F2F2FF">components, the space between columns</text><text x="494.8" y="224.4" font-size="14" fill="#F2F2FF">and the default column weight.</text><text x="32.0" y="303.4" font-size="14" fill="#F2F2FF">components.py (text)</text><text x="205.5" y="303.4" font-size="14" fill="#F2F2FF">LINE_HEIGHT_RATIO, BASELINE_RATIO,</text><text x="205.5" y="324.4" font-size="14" fill="#F2F2FF">BOLD_WEIGHT</text><text x="494.8" y="303.4" font-size="14" fill="#F2F2FF">The height of each line and the weight of</text><text x="494.8" y="324.4" font-size="14" fill="#F2F2FF">bold text.</text><text x="32.0" y="361.4" font-size="14" fill="#F2F2FF">components.py (title,</text><text x="32.0" y="382.4" font-size="14" fill="#F2F2FF">subsection)</text><text x="205.5" y="361.4" font-size="14" fill="#F2F2FF">TITLE_BAR_WIDTH,</text><text x="205.5" y="382.4" font-size="14" fill="#F2F2FF">TITLE_BAR_HEIGHT_RATIO,</text><text x="205.5" y="403.4" font-size="14" fill="#F2F2FF">TITLE_BAR_GAP,</text><text x="205.5" y="424.4" font-size="14" fill="#F2F2FF">SUBSECTION_MARKER_RADIUS_RATIO</text><text x="205.5" y="445.4" font-size="14" fill="#F2F2FF">, SUBSECTION_MARKER_GAP</text><text x="494.8" y="361.4" font-size="14" fill="#F2F2FF">The size of the title bar and the subsection</text><text x="494.8" y="382.4" font-size="14" fill="#F2F2FF">dot, and their distance to the text.</text><text x="32.0" y="482.4" font-size="14" fill="#F2F2FF">components.py (table)</text><text x="205.5" y="482.4" font-size="14" fill="#F2F2FF">TABLE_FONT_SIZE,</text><text x="205.5" y="503.4" font-size="14" fill="#F2F2FF">TABLE_CELL_PADDING,</text><text x="205.5" y="524.4" font-size="14" fill="#F2F2FF">TABLE_BORDER_RADIUS,</text><text x="205.5" y="545.4" font-size="14" fill="#F2F2FF">TABLE_LINE_WIDTH, TRUE_SYMBOL,</text><text x="205.5" y="566.4" font-size="14" fill="#F2F2FF">FALSE_SYMBOL</text><text x="494.8" y="482.4" font-size="14" fill="#F2F2FF">The default look of tables and the symbols</text><text x="494.8" y="503.4" font-size="14" fill="#F2F2FF">drawn for booleans.</text><text x="32.0" y="603.4" font-size="14" fill="#F2F2FF">components.py (divider)</text><text x="205.5" y="603.4" font-size="14" fill="#F2F2FF">DIVIDER_THICKNESS,</text><text x="205.5" y="624.4" font-size="14" fill="#F2F2FF">DIVIDER_COVERAGE</text><text x="494.8" y="603.4" font-size="14" fill="#F2F2FF">The thickness of dividers and their default</text><text x="494.8" y="624.4" font-size="14" fill="#F2F2FF">coverage.</text><text x="32.0" y="661.4" font-size="14" fill="#F2F2FF">frame.py</text><text x="205.5" y="661.4" font-size="14" fill="#F2F2FF">BORDER_WIDTH, CORNER_RADIUS,</text><text x="205.5" y="682.4" font-size="14" fill="#F2F2FF">BACKGROUND_GLOW_RADIUS</text><text x="494.8" y="661.4" font-size="14" fill="#F2F2FF">The border thickness, the rounded corners</text><text x="494.8" y="682.4" font-size="14" fill="#F2F2FF">and how far the background glow spreads.</text><rect x="24.5" y="122.5" width="751.0" height="573.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="723.6" font-size="16" fill="#F2F2FF">Two good starting points: <tspan fill="#00F0FF" font-weight="700">COMPONENT_GAP</tspan> (a tighter or looser block) and</text><text x="24.0" y="747.6" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">BACKGROUND_GLOW_RADIUS</tspan> (a more concentrated or more spread glow). The space around the</text><text x="24.0" y="771.6" font-size="16" fill="#F2F2FF">content and the look of animations are not constants: they are the <tspan fill="#00F0FF" font-weight="700">padding</tspan> parameter of Block and the</text><text x="24.0" y="795.6" font-size="16" fill="#F2F2FF">parameters of Animation.</text><text x="24.0" y="829.6" font-size="16" fill="#F2F2FF">Line breaks are calculated with the widths of the Arial font. If something looks off after a change, restore</text><text x="24.0" y="853.6" font-size="16" fill="#F2F2FF">the original values.</text></g></g></g></svg>