</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="321" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="321" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Base Animations</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">These are the animations with their default values. The previews below replay by themselves, so you do</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">not need to reload the page.</text><circle cx="27.1" cy="134.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="140.7" font-size="17" fill="#B26BFF" font-weight="700">Entrances</text><text x="24.0" y="175.1" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">Fade</tspan>, <tspan fill="#00F0FF" font-weight="700">Rise</tspan>, <tspan fill="#00F0FF" font-weight="700">Drop</tspan> and <tspan fill="#00F0FF" font-weight="700">Pop</tspan> start hidden or away from their place and end in place. They play once, when</text><text x="24.0" y="199.1" font-size="16" fill="#F2F2FF">the image loads.</text><circle cx="27.1" cy="228.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="234.2" font-size="17" fill="#B26BFF" font-weight="700">Ambient</text><text x="24.0" y="268.6" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">Pulse</tspan> keeps the block visible and in place, with a gentle movement. It plays once by default: use</text><text x="24.0" y="292.6" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">loop_limit</tspan> to repeat it, or to make it infinite.</text></g></g></g></svg>