<svg xmlns="http://www.w3.org/2000/svg" width="800" height="662" viewBox="0 0 800 662"><style>
@keyframes fadein-ac8a6a58 {
0% { opacity: 0; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); } 100% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
.fadein-ac8a6a58 {
  animation: fadein-ac8a6a58 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fadein-ac8a6a58 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="660" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="660" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Base Animations</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">These are the animations with their default values. The previews below replay by themselves, so you do</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">not need to reload the page.</text><circle cx="27.1" cy="134.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="140.7" font-size="17" fill="#B26BFF" font-weight="700">Entrances</text><text x="24.0" y="175.1" font-size="16" fill="#F2F2FF">Every name ending in <tspan fill="#00F0FF" font-weight="700">In</tspan> starts hidden or away from its place and ends in place. They play once, when the</text><text x="24.0" y="199.1" font-size="16" fill="#F2F2FF">image loads.</text><circle cx="27.1" cy="228.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="234.2" font-size="17" fill="#B26BFF" font-weight="700">Exits</text><text x="24.0" y="268.6" font-size="16" fill="#F2F2FF">Every entrance has an exit with <tspan fill="#00F0FF" font-weight="700">Out</tspan> in place of <tspan fill="#00F0FF" font-weight="700">In</tspan>. The block starts in place and ends hidden. Most exits</text><text x="24.0" y="292.6" font-size="16" fill="#F2F2FF">are the entrance played backwards, but <tspan fill="#00F0FF" font-weight="700">RiseOut</tspan>, <tspan fill="#00F0FF" font-weight="700">DropOut</tspan>, <tspan fill="#00F0FF" font-weight="700">SlideOut</tspan> and <tspan fill="#00F0FF" font-weight="700">SpinOut</tspan> keep going the same</text><text x="24.0" y="316.6" font-size="16" fill="#F2F2FF">way instead of returning. A rise comes in moving up and leaves moving up. To leave the way it came, use</text><text x="24.0" y="340.6" font-size="16" fill="#F2F2FF">the opposite exit: <tspan fill="#00F0FF" font-weight="700">Sequence(RiseIn(), DropOut())</tspan>.</text><text x="24.0" y="374.6" font-size="16" fill="#F2F2FF">The previews of exits start visible, play the exit, wait hidden for a moment and come back with a short</text><text x="24.0" y="398.6" font-size="16" fill="#F2F2FF">fade.</text><text x="24.0" y="432.6" font-size="16" fill="#F2F2FF">In the previews, each row shows an entrance on the left and its exit on the right.</text><circle cx="27.1" cy="461.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="467.7" font-size="17" fill="#B26BFF" font-weight="700">Ambient</text><text x="24.0" y="502.1" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">Pulse</tspan>, <tspan fill="#00F0FF" font-weight="700">Float</tspan>, <tspan fill="#00F0FF" font-weight="700">Sway</tspan>, <tspan fill="#00F0FF" font-weight="700">Shake</tspan>, <tspan fill="#00F0FF" font-weight="700">Rotate</tspan>, <tspan fill="#00F0FF" font-weight="700">Drift</tspan> and <tspan fill="#00F0FF" font-weight="700">Jelly</tspan> keep the block visible, with a continuous movement.</text><text x="24.0" y="526.1" font-size="16" fill="#F2F2FF">They play once by default: use <tspan fill="#00F0FF" font-weight="700">loop_limit</tspan> to repeat them, or to make them infinite. <tspan fill="#00F0FF" font-weight="700">Shake</tspan> and <tspan fill="#00F0FF" font-weight="700">Jelly</tspan> lose</text><text x="24.0" y="550.1" font-size="16" fill="#F2F2FF">strength until they stop. <tspan fill="#00F0FF" font-weight="700">Rotate</tspan> and <tspan fill="#00F0FF" font-weight="700">Drift</tspan> use a linear easing, so the loop has no jolt where it restarts.</text><rect x="24.0" y="566.5" width="752.0" height="2" rx="1" fill="#7000FF"/><circle cx="27.1" cy="591.2" r="3.1" fill="#00F0FF"/><text x="38.1" y="597.2" font-size="17" fill="#B26BFF" font-weight="700">Browser Limitations</text><text x="24.0" y="631.6" font-size="16" fill="#F2F2FF"><tspan fill="#00F0FF" font-weight="700">Safari</tspan> doesn't render blur, so <tspan fill="#FF6BA8" text-decoration="underline">FocusIn</tspan> and <tspan fill="#FF6BA8" text-decoration="underline">FocusOut</tspan> may apear identical to <tspan fill="#FF6BA8" text-decoration="underline">FadeIn</tspan> and <tspan fill="#FF6BA8" text-decoration="underline">FadeOut</tspan></text></g></g></g></svg>