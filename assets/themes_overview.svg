</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="593" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="593" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Themes</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">A theme defines <tspan fill="#00F0FF" font-weight="700">only colors</tspan>: the border gradient, the glowing background, titles, subsections, text, inline</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">styles, tables and dividers. The layout, the font and the animation are the same in every theme, so you</text><text x="24.0" y="129.6" font-size="16" fill="#F2F2FF">can switch themes without anything else moving.</text><text x="24.0" y="163.6" font-size="16" fill="#F2F2FF">To use a theme, pass its name to the block: theme="japandark".</text><text x="24.0" y="197.6" font-size="16" fill="#F2F2FF">Theme names are lowercase and written together, exactly as listed in each category. Every preview below</text><text x="24.0" y="221.6" font-size="16" fill="#F2F2FF">shows everything a theme colors.</text><clipPath id="table-clip-24-238"><rect x="24.0" y="238.0" width="752.0" height="333.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-238)"><rect x="24.0" y="238.0" width="752.0" height="333.0" fill="#0C0D1B"/><rect x="24.0" y="238.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="312.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="38