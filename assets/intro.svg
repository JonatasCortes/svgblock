</style><g transform="translate(0 0)"><g class="fadein-ac8a6a58"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="320" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="320" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Welcome to svgblock</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Themed, animated blocks of text, tables and images, saved as a single <tspan fill="#00F0FF" font-weight="700">.svg</tspan> file. Use them in READMEs,</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">web pages, documentation, or anywhere an image fits.</text><rect x="24.0" y="122.0" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="151.6" font-size="16" fill="#F2F2FF">With a few lines of Python you get a block with a gradient border, a glowing background and an animation.</text><text x="24.0" y="175.6" font-size="16" fill="#F2F2FF">You pick a <tspan fill="#00F0FF" font-weight="700">theme</tspan> and an <tspan fill="#00F0FF" font-weight="700">animation</tspan>, and svgblock takes care of colors, spacing, line breaks and the</text><text x="24.0" y="199.6" font-size="16" fill="#F2F2FF">height of the block.</text><text x="24.0" y="233.6" font-size="16" fill="#F2F2FF">It is plain Python with no external dependencies, and <tspan fill="#00F0FF" font-weight="700">50 ready-made themes</tspan> are included. You can also</text><text x="24.0" y="257.6" font-size="16" fill="#F2F2FF">edit them or create your own without touching the library's code.</text><text x="24.0" y="291.6" font-size="16" fill="#F2F2FF"><tspan fill="#C7B5FF" font-style="italic">Every block in this README was made with svgblock itself.</tspan></text></g></g></g></svg>