</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1213.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1213.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Creating Your Own Theme</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">A theme is a <tspan fill="#00F0FF" font-weight="700">ThemeData</tspan>: a dictionary that holds the colors of a block. Create one in your own code and</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">pass it to <tspan fill="#00F0FF" font-weight="700">Block(theme=...)</tspan>, exactly like a ready-made theme.</text><text x="24.0" y="139.6" font-size="16" fill="#F2F2FF">Every ThemeData has these <tspan fill="#00F0FF" font-weight="700">21 colors</tspan>, written as hexadecimal values (#RRGGBB):</text><clipPath id="table-clip-24-156"><rect x="24.0" y="156.0" width="752.0" height="814.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-156)"><rect x="24.0" y="156.0" width="752.0" height="814.0" fill="#0C0D1B"/><rect x="24.0" y="156.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="230.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="304.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="378.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="452.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="526.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="600.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="674.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="748.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="822.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="896.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="193.0" x2="776.0" y2="193.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="230.0" x2="776.0" y2="230.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="267.0" x2="776.0" y2="267.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="304.0" x2="776.0" y2="304.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="341.0" x2="776.0" y2="341.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="378.0" x2="776.0" y2="378.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="415.0" x2="776.0" y2="415.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="452.0" x2="776.0" y2="452.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="489.0" x2="776.0" y2="489.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="526.0" x2="776.0" y2="526.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="563.0" x2="776.0" y2="563.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="600.0" x2="776.0" y2="600.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="637.0" x2="776.0" y2="637.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="674.0" x2="776.0" y2="674.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="711.0" x2="776.0" y2="711.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="748.0" x2="776.0" y2="748.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="785.0" x2="776.0" y2="785.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="822.0" x2="776.0" y2="822.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="859.0" x2="776.0" y2="859.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="896.0" x2="776.0" y2="896.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="933.0" x2="776.0" y2="933.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="179.4" font-size="14" fill="#FF1F6E" font-weight="700">Color</text><text x="332.8" y="179.4" font-size="14" fill="#FF1F6E" font-weight="700">What it paints</text><text x="32.0" y="216.4" font-size="14" fill="#F2F2FF">background_center</text><text x="332.8" y="216.4" font-size="14" fill="#F2F2FF">The center of the radial glow in the background.</text><text x="32.0" y="253.4" font-size="14" fill="#F2F2FF">background_edge</text><text x="332.8" y="253.4" font-size="14" fill="#F2F2FF">The outer color of the background, at the edges of the block.</text><text x="32.0" y="290.4" font-size="14" fill="#F2F2FF">border_start</text><text x="332.8" y="290.4" font-size="14" fill="#F2F2FF">The start of the border gradient (top left).</text><text x="32.0" y="327.4" font-size="14" fill="#F2F2FF">border_end</text><text x="332.8" y="327.4" font-size="14" fill="#F2F2FF">The end of the border gradient (bottom right).</text><text x="32.0" y="364.4" font-size="14" fill="#F2F2FF">title_text</text><text x="332.8" y="364.4" font-size="14" fill="#F2F2FF">The text of titles.</text><text x="32.0" y="401.4" font-size="14" fill="#F2F2FF">title_bar</text><text x="332.8" y="401.4" font-size="14" fill="#F2F2FF">The bar on the left of titles.</text><text x="32.0" y="438.4" font-size="14" fill="#F2F2FF">subsection_text</text><text x="332.8" y="438.4" font-size="14" fill="#F2F2FF">The text of subsections.</text><text x="32.0" y="475.4" font-size="14" fill="#F2F2FF">subsection_marker</text><text x="332.8" y="475.4" font-size="14" fill="#F2F2FF">The dot on the left of subsections.</text><text x="32.0" y="512.4" font-size="14" fill="#F2F2FF">text</text><text x="332.8" y="512.4" font-size="14" fill="#F2F2FF">Regular paragraphs.</text><text x="32.0" y="549.4" font-size="14" fill="#F2F2FF">highlight</text><text x="332.8" y="549.4" font-size="14" fill="#F2F2FF">Highlighted words (also drawn in bold).</text><text x="32.0" y="586.4" font-size="14" fill="#F2F2FF">underline</text><text x="332.8" y="586.4" font-size="14" fill="#F2F2FF">Underlined words.</text><text x="32.0" y="623.4" font-size="14" fill="#F2F2FF">strikethrough</text><text x="332.8" y="623.4" font-size="14" fill="#F2F2FF">Struck-through words.</text><text x="32.0" y="660.4" font-size="14" fill="#F2F2FF">italic</text><text x="332.8" y="660.4" font-size="14" fill="#F2F2FF">Italic words.</text><text x="32.0" y="697.4" font-size="14" fill="#F2F2FF">table_background</text><text x="332.8" y="697.4" font-size="14" fill="#F2F2FF">The background of the table body.</text><text x="32.0" y="734.4" font-size="14" fill="#F2F2FF">table_header_background</text><text x="332.8" y="734.4" font-size="14" fill="#F2F2FF">The background of the table header row.</text><text x="32.0" y="771.4" font-size="14" fill="#F2F2FF">table_header_text</text><text x="332.8" y="771.4" font-size="14" fill="#F2F2FF">The text of the table header.</text><text x="32.0" y="808.4" font-size="14" fill="#F2F2FF">table_text</text><text x="332.8" y="808.4" font-size="14" fill="#F2F2FF">The text of table cells.</text><text x="32.0" y="845.4" font-size="14" fill="#F2F2FF">table_divider</text><text x="332.8" y="845.4" font-size="14" fill="#F2F2FF">The lines between rows and columns.</text><text x="32.0" y="882.4" font-size="14" fill="#F2F2FF">table_stripe_background</text><text x="332.8" y="882.4" font-size="14" fill="#F2F2FF">The background of striped rows.</text><text x="32.0" y="919.4" font-size="14" fill="#F2F2FF">table_border</text><text x="332.8" y="919.4" font-size="14" fill="#F2F2FF">The outer border of the table.</text><text x="32.0" y="956.4" font-size="14" fill="#F2F2FF">divider</text><text x="332.8" y="956.4" font-size="14" fill="#F2F2FF">The line drawn by the divider component.</text><rect x="24.5" y="156.5" width="751.0" height="813.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><rect x="24.0" y="980.0" width="752.0" height="2" rx="1" fill="#7000FF"/><circle cx="27.1" cy="1004.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="1010.7" font-size="17" fill="#B26BFF" font-weight="700">Good to know</text><text x="24.0" y="1045.1" font-size="16" fill="#F2F2FF">• Give every color. Python does not check a ThemeData while the program runs, so a missing color only</text><text x="24.0" y="1069.1" font-size="16" fill="#F2F2FF">shows up as an error when the block is drawn. Editors with type checking point it out earlier.</text><text x="24.0" y="1103.1" font-size="16" fill="#F2F2FF">• The background is a radial glow, so give the two background colors some difference: with the same</text><text x="24.0" y="1127.1" font-size="16" fill="#F2F2FF">color in both, the glow is invisible.</text><text x="24.0" y="1161.1" font-size="16" fill="#F2F2FF">• Choose text colors with good contrast against the background. Inline styles are drawn over the same</text><text x="24.0" y="1185.1" font-size="16" fill="#F2F2FF">background as regular text.</text></g></g></g></svg>