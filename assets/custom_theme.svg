<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1112" viewBox="0 0 800 1112"><style>
@keyframes entry {
  from { opacity: 0; } to { opacity: 1; transform: none; }
}
.entry {
  animation: entry 0.8s ease-out both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .entry { animation: none; }
}
</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1110" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1110" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Creating Your Own Theme</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">A theme is an entry in the THEMES dictionary, in the file <tspan fill="#00F0FF" font-weight="700">svgblock/themes.py</tspan>. The name is lowercase</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">and is exactly what you pass to Block(theme=...). Every entry has these <tspan fill="#00F0FF" font-weight="700">21 colors</tspan>, written as</text><text x="24.0" y="129.6" font-size="16" fill="#F2F2FF">hexadecimal values (#RRGGBB):</text><clipPath id="table-clip-24-146"><rect x="24.0" y="146.0" width="752.0" height="814.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-146)"><rect x="24.0" y="146.0" width="752.0" height="814.0" fill="#0C0D1B"/><rect x="24.0" y="146.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="220.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="294.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="368.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="442.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="516.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="590.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="664.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="738.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="812.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="886.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="183.0" x2="776.0" y2="183.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="220.0" x2="776.0" y2="220.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="257.0" x2="776.0" y2="257.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="294.0" x2="776.0" y2="294.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="331.0" x2="776.0" y2="331.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="368.0" x2="776.0" y2="368.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="405.0" x2="776.0" y2="405.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="442.0" x2="776.0" y2="442.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="479.0" x2="776.0" y2="479.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="516.0" x2="776.0" y2="516.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="553.0" x2="776.0" y2="553.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="590.0" x2="776.0" y2="590.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="627.0" x2="776.0" y2="627.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="664.0" x2="776.0" y2="664.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="701.0" x2="776.0" y2="701.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="738.0" x2="776.0" y2="738.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="775.0" x2="776.0" y2="775.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="812.0" x2="776.0" y2="812.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="849.0" x2="776.0" y2="849.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="886.0" x2="776.0" y2="886.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="923.0" x2="776.0" y2="923.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="169.4" font-size="14" fill="#FF1F6E" font-weight="700">Color</text><text x="332.8" y="169.4" font-size="14" fill="#FF1F6E" font-weight="700">What it paints</text><text x="32.0" y="206.4" font-size="14" fill="#F2F2FF">background_center</text><text x="332.8" y="206.4" font-size="14" fill="#F2F2FF">The center of the radial glow in the background.</text><text x="32.0" y="243.4" font-size="14" fill="#F2F2FF">background_edge</text><text x="332.8" y="243.4" font-size="14" fill="#F2F2FF">The outer color of the background, at the edges of the block.</text><text x="32.0" y="280.4" font-size="14" fill="#F2F2FF">border_start</text><text x="332.8" y="280.4" font-size="14" fill="#F2F2FF">The start of the border gradient (top left).</text><text x="32.0" y="317.4" font-size="14" fill="#F2F2FF">border_end</text><text x="332.8" y="317.4" font-size="14" fill="#F2F2FF">The end of the border gradient (bottom right).</text><text x="32.0" y="354.4" font-size="14" fill="#F2F2FF">title_text</text><text x="332.8" y="354.4" font-size="14" fill="#F2F2FF">The text of titles.</text><text x="32.0" y="391.4" font-size="14" fill="#F2F2FF">title_bar</text><text x="332.8" y="391.4" font-size="14" fill="#F2F2FF">The bar on the left of titles.</text><text x="32.0" y="428.4" font-size="14" fill="#F2F2FF">subsection_text</text><text x="332.8" y="428.4" font-size="14" fill="#F2F2FF">The text of subsections.</text><text x="32.0" y="465.4" font-size="14" fill="#F2F2FF">subsection_marker</text><text x="332.8" y="465.4" font-size="14" fill="#F2F2FF">The dot on the left of subsections.</text><text x="32.0" y="502.4" font-size="14" fill="#F2F2FF">text</text><text x="332.8" y="502.4" font-size="14" fill="#F2F2FF">Regular paragraphs.</text><text x="32.0" y="539.4" font-size="14" fill="#F2F2FF">highlight</text><text x="332.8" y="539.4" font-size="14" fill="#F2F2FF">Highlighted words (also drawn in bold).</text><text x="32.0" y="576.4" font-size="14" fill="#F2F2FF">underline</text><text x="332.8" y="576.4" font-size="14" fill="#F2F2FF">Underlined words.</text><text x="32.0" y="613.4" font-size="14" fill="#F2F2FF">strikethrough</text><text x="332.8" y="613.4" font-size="14" fill="#F2F2FF">Struck-through words.</text><text x="32.0" y="650.4" font-size="14" fill="#F2F2FF">italic</text><text x="332.8" y="650.4" font-size="14" fill="#F2F2FF">Italic words.</text><text x="32.0" y="687.4" font-size="14" fill="#F2F2FF">table_background</text><text x="332.8" y="687.4" font-size="14" fill="#F2F2FF">The background of the table body.</text><text x="32.0" y="724.4" font-size="14" fill="#F2F2FF">table_header_background</text><text x="332.8" y="724.4" font-size="14" fill="#F2F2FF">The background of the table header row.</text><text x="32.0" y="761.4" font-size="14" fill="#F2F2FF">table_header_text</text><text x="332.8" y="761.4" font-size="14" fill="#F2F2FF">The text of the table header.</text><text x="32.0" y="798.4" font-size="14" fill="#F2F2FF">table_text</text><text x="332.8" y="798.4" font-size="14" fill="#F2F2FF">The text of table cells.</text><text x="32.0" y="835.4" font-size="14" fill="#F2F2FF">table_divider</text><text x="332.8" y="835.4" font-size="14" fill="#F2F2FF">The lines between rows and columns.</text><text x="32.0" y="872.4" font-size="14" fill="#F2F2FF">table_stripe_background</text><text x="332.8" y="872.4" font-size="14" fill="#F2F2FF">The background of striped rows.</text><text x="32.0" y="909.4" font-size="14" fill="#F2F2FF">table_border</text><text x="332.8" y="909.4" font-size="14" fill="#F2F2FF">The outer border of the table.</text><text x="32.0" y="946.4" font-size="14" fill="#F2F2FF">divider</text><text x="332.8" y="946.4" font-size="14" fill="#F2F2FF">The line drawn by the divider component.</text><rect x="24.5" y="146.5" width="751.0" height="813.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><rect x="24.0" y="970.0" width="752.0" height="2" rx="1" fill="#7000FF"/><text x="24.0" y="999.6" font-size="16" fill="#F2F2FF">The background is a radial glow, so give the two background colors some difference: with the same color</text><text x="24.0" y="1023.6" font-size="16" fill="#F2F2FF">in both, the glow is invisible.</text><text x="24.0" y="1057.6" font-size="16" fill="#F2F2FF">Choose text colors with good contrast against the background. Inline styles are drawn over the same</text><text x="24.0" y="1081.6" font-size="16" fill="#F2F2FF">background as regular text.</text></g></g></svg>