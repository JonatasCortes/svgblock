<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1297.5" viewBox="0 0 800 1297.5"><style>
@keyframes entry {
  from { opacity: 0; } to { opacity: 1; transform: none; }
}
.entry {
  animation: entry 0.8s ease-out both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .entry { animation: none; }
}
</style><g class="entry"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="1295.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="1295.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Creating Your Own Theme</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">A theme is a <tspan fill="#00F0FF" font-weight="700">ThemeData</tspan>: a dictionary that holds the colors of a block. Create one in your own code and</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">pass it to <tspan fill="#00F0FF" font-weight="700">Block(theme=...)</tspan>, exactly like a ready-made theme. You do not edit the library and you do not</text><text x="24.0" y="129.6" font-size="16" fill="#F2F2FF">need to register the theme anywhere.</text><text x="24.0" y="163.6" font-size="16" fill="#F2F2FF">Every ThemeData has these <tspan fill="#00F0FF" font-weight="700">21 colors</tspan>, written as hexadecimal values (#RRGGBB):</text><clipPath id="table-clip-24-180"><rect x="24.0" y="180.0" width="752.0" height="814.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-180)"><rect x="24.0" y="180.0" width="752.0" height="814.0" fill="#0C0D1B"/><rect x="24.0" y="180.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="254.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="328.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="402.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="476.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="550.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="624.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="698.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="772.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="846.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="920.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="217.0" x2="776.0" y2="217.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="254.0" x2="776.0" y2="254.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="291.0" x2="776.0" y2="291.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="328.0" x2="776.0" y2="328.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="365.0" x2="776.0" y2="365.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="402.0" x2="776.0" y2="402.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="439.0" x2="776.0" y2="439.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="476.0" x2="776.0" y2="476.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="513.0" x2="776.0" y2="513.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="550.0" x2="776.0" y2="550.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="587.0" x2="776.0" y2="587.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="624.0" x2="776.0" y2="624.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="661.0" x2="776.0" y2="661.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="698.0" x2="776.0" y2="698.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="735.0" x2="776.0" y2="735.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="772.0" x2="776.0" y2="772.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="809.0" x2="776.0" y2="809.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="846.0" x2="776.0" y2="846.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="883.0" x2="776.0" y2="883.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="920.0" x2="776.0" y2="920.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="957.0" x2="776.0" y2="957.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="203.4" font-size="14" fill="#FF1F6E" font-weight="700">Color</text><text x="332.8" y="203.4" font-size="14" fill="#FF1F6E" font-weight="700">What it paints</text><text x="32.0" y="240.4" font-size="14" fill="#F2F2FF">background_center</text><text x="332.8" y="240.4" font-size="14" fill="#F2F2FF">The center of the radial glow in the background.</text><text x="32.0" y="277.4" font-size="14" fill="#F2F2FF">background_edge</text><text x="332.8" y="277.4" font-size="14" fill="#F2F2FF">The outer color of the background, at the edges of the block.</text><text x="32.0" y="314.4" font-size="14" fill="#F2F2FF">border_start</text><text x="332.8" y="314.4" font-size="14" fill="#F2F2FF">The start of the border gradient (top left).</text><text x="32.0" y="351.4" font-size="14" fill="#F2F2FF">border_end</text><text x="332.8" y="351.4" font-size="14" fill="#F2F2FF">The end of the border gradient (bottom right).</text><text x="32.0" y="388.4" font-size="14" fill="#F2F2FF">title_text</text><text x="332.8" y="388.4" font-size="14" fill="#F2F2FF">The text of titles.</text><text x="32.0" y="425.4" font-size="14" fill="#F2F2FF">title_bar</text><text x="332.8" y="425.4" font-size="14" fill="#F2F2FF">The bar on the left of titles.</text><text x="32.0" y="462.4" font-size="14" fill="#F2F2FF">subsection_text</text><text x="332.8" y="462.4" font-size="14" fill="#F2F2FF">The text of subsections.</text><text x="32.0" y="499.4" font-size="14" fill="#F2F2FF">subsection_marker</text><text x="332.8" y="499.4" font-size="14" fill="#F2F2FF">The dot on the left of subsections.</text><text x="32.0" y="536.4" font-size="14" fill="#F2F2FF">text</text><text x="332.8" y="536.4" font-size="14" fill="#F2F2FF">Regular paragraphs.</text><text x="32.0" y="573.4" font-size="14" fill="#F2F2FF">highlight</text><text x="332.8" y="573.4" font-size="14" fill="#F2F2FF">Highlighted words (also drawn in bold).</text><text x="32.0" y="610.4" font-size="14" fill="#F2F2FF">underline</text><text x="332.8" y="610.4" font-size="14" fill="#F2F2FF">Underlined words.</text><text x="32.0" y="647.4" font-size="14" fill="#F2F2FF">strikethrough</text><text x="332.8" y="647.4" font-size="14" fill="#F2F2FF">Struck-through words.</text><text x="32.0" y="684.4" font-size="14" fill="#F2F2FF">italic</text><text x="332.8" y="684.4" font-size="14" fill="#F2F2FF">Italic words.</text><text x="32.0" y="721.4" font-size="14" fill="#F2F2FF">table_background</text><text x="332.8" y="721.4" font-size="14" fill="#F2F2FF">The background of the table body.</text><text x="32.0" y="758.4" font-size="14" fill="#F2F2FF">table_header_background</text><text x="332.8" y="758.4" font-size="14" fill="#F2F2FF">The background of the table header row.</text><text x="32.0" y="795.4" font-size="14" fill="#F2F2FF">table_header_text</text><text x="332.8" y="795.4" font-size="14" fill="#F2F2FF">The text of the table header.</text><text x="32.0" y="832.4" font-size="14" fill="#F2F2FF">table_text</text><text x="332.8" y="832.4" font-size="14" fill="#F2F2FF">The text of table cells.</text><text x="32.0" y="869.4" font-size="14" fill="#F2F2FF">table_divider</text><text x="332.8" y="869.4" font-size="14" fill="#F2F2FF">The lines between rows and columns.</text><text x="32.0" y="906.4" font-size="14" fill="#F2F2FF">table_stripe_background</text><text x="332.8" y="906.4" font-size="14" fill="#F2F2FF">The background of striped rows.</text><text x="32.0" y="943.4" font-size="14" fill="#F2F2FF">table_border</text><text x="332.8" y="943.4" font-size="14" fill="#F2F2FF">The outer border of the table.</text><text x="32.0" y="980.4" font-size="14" fill="#F2F2FF">divider</text><text x="332.8" y="980.4" font-size="14" fill="#F2F2FF">The line drawn by the divider component.</text><rect x="24.5" y="180.5" width="751.0" height="813.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><rect x="24.0" y="1004.0" width="752.0" height="2" rx="1" fill="#7000FF"/><circle cx="27.1" cy="1028.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="1034.7" font-size="17" fill="#B26BFF" font-weight="700">Good to know</text><text x="24.0" y="1069.1" font-size="16" fill="#F2F2FF">• Give every color. Python does not check a ThemeData while the program runs, so a missing color only</text><text x="24.0" y="1093.1" font-size="16" fill="#F2F2FF">shows up as an error when the block is drawn. Editors with type checking point it out earlier.</text><text x="24.0" y="1127.1" font-size="16" fill="#F2F2FF">• The background is a radial glow, so give the two background colors some difference: with the same</text><text x="24.0" y="1151.1" font-size="16" fill="#F2F2FF">color in both, the glow is invisible.</text><text x="24.0" y="1185.1" font-size="16" fill="#F2F2FF">• Choose text colors with good contrast against the background. Inline styles are drawn over the same</text><text x="24.0" y="1209.1" font-size="16" fill="#F2F2FF">background as regular text.</text><text x="24.0" y="1243.1" font-size="16" fill="#F2F2FF">• A ThemeData is an ordinary variable. Keep it in your own module and reuse it in as many blocks as</text><text x="24.0" y="1267.1" font-size="16" fill="#F2F2FF">you want.</text></g></g></svg>