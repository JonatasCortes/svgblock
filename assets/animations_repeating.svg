<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550.5" viewBox="0 0 800 550.5"><style>
@keyframes fade-f16f3800 {
0% { opacity: 0; transform: translate(0px, 0px) scale(1); } 100% { opacity: 1; transform: translate(0px, 0px) scale(1); }
}
.fade-f16f3800 {
  animation: fade-f16f3800 0.8s ease-out 0s 1 both;
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: reduce) {
  .fade-f16f3800 { animation: none; }
}
</style><g transform="translate(0 0)"><g class="fade-f16f3800"><defs><radialGradient id="background" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#121324"/><stop offset="1" stop-color="#080811"/></radialGradient><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0055"/><stop offset="1" stop-color="#7000FF"/></linearGradient></defs><rect x="1" y="1" width="798" height="548.5" rx="15" fill="url(#background)" stroke="none" stroke-width="2"/><rect x="1" y="1" width="798" height="548.5" rx="15" fill="none" stroke="url(#border)" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24.0" y="27.0" width="4" height="24.0" rx="2" fill="#FF0055"/><text x="39.0" y="46.0" font-size="20" fill="#FF1F6E" font-weight="700">Repeating</text><text x="24.0" y="81.6" font-size="16" fill="#F2F2FF">Animations that can repeat take <tspan fill="#00F0FF" font-weight="700">loop_limit</tspan>: the number of times they run again after the first run. The</text><text x="24.0" y="105.6" font-size="16" fill="#F2F2FF">default is 0, which means they run once.</text><clipPath id="table-clip-24-122"><rect x="24.0" y="122.0" width="752.0" height="185.0" rx="8"/></clipPath><g clip-path="url(#table-clip-24-122)"><rect x="24.0" y="122.0" width="752.0" height="185.0" fill="#0C0D1B"/><rect x="24.0" y="122.0" width="752.0" height="37.0" fill="#1F1040"/><rect x="24.0" y="196.0" width="752.0" height="37.0" fill="#101125"/><rect x="24.0" y="270.0" width="752.0" height="37.0" fill="#101125"/></g><line x1="24.0" y1="159.0" x2="776.0" y2="159.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="196.0" x2="776.0" y2="196.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="233.0" x2="776.0" y2="233.0" stroke="#2D2F5C" stroke-width="1"/><line x1="24.0" y1="270.0" x2="776.0" y2="270.0" stroke="#2D2F5C" stroke-width="1"/><text x="32.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">loop_limit</text><text x="220.0" y="145.4" font-size="14" fill="#FF1F6E" font-weight="700">Total runs</text><text x="32.0" y="182.4" font-size="14" fill="#F2F2FF">0 (default)</text><text x="220.0" y="182.4" font-size="14" fill="#F2F2FF">1</text><text x="32.0" y="219.4" font-size="14" fill="#F2F2FF">1</text><text x="220.0" y="219.4" font-size="14" fill="#F2F2FF">2</text><text x="32.0" y="256.4" font-size="14" fill="#F2F2FF">4</text><text x="220.0" y="256.4" font-size="14" fill="#F2F2FF">5</text><text x="32.0" y="293.4" font-size="14" fill="#F2F2FF">None</text><text x="220.0" y="293.4" font-size="14" fill="#F2F2FF">No limit: it never stops</text><rect x="24.5" y="122.5" width="751.0" height="184.0" rx="8" fill="none" stroke="#4B2A9A" stroke-width="1"/><text x="24.0" y="334.6" font-size="16" fill="#F2F2FF">None means there is no limit, so the animation is <tspan fill="#00F0FF" font-weight="700">infinite</tspan>. Infinite animations have rules inside sequences:</text><text x="24.0" y="358.6" font-size="16" fill="#F2F2FF">see Sequences.</text><text x="24.0" y="392.6" font-size="16" fill="#F2F2FF">The largest finite value is 1000. For more than that, use None.</text><circle cx="27.1" cy="421.8" r="3.1" fill="#00F0FF"/><text x="38.1" y="427.7" font-size="17" fill="#B26BFF" font-weight="700">Which animations repeat</text><text x="24.0" y="462.1" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">Pulse</tspan> and <tspan fill="#00F0FF" font-weight="700">Sequence</tspan> accept loop_limit.</text><text x="24.0" y="496.1" font-size="16" fill="#F2F2FF">• <tspan fill="#00F0FF" font-weight="700">Fade</tspan>, <tspan fill="#00F0FF" font-weight="700">Rise</tspan>, <tspan fill="#00F0FF" font-weight="700">Drop</tspan> and <tspan fill="#00F0FF" font-weight="700">Pop</tspan> play once and do not accept it. To replay an entrance, put it in a <tspan fill="#00F0FF" font-weight="700">Sequence</tspan></text><text x="24.0" y="520.1" font-size="16" fill="#F2F2FF">with a <tspan fill="#00F0FF" font-weight="700">Show</tspan> step and make the sequence infinite.</text></g></g></g></svg>