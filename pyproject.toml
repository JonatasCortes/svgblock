[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svgblock"
version = "0.1.0"
description = "Generate themed SVG text blocks with animated entrances."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
keywords = ["svg", "readme", "github", "profile", "text"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["svgblock", "svgblock.*"]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = [
    "error",
]

[tool.coverage.run]
source_pkgs = ["svgblock"]
branch = true

[tool.coverage.paths]
source = [
    "src/svgblock",
    "*/site-packages/svgblock",
]

[tool.coverage.report]
show_missing = true

exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
    "@(abc\\.)?abstractmethod",
]